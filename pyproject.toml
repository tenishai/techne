[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tenish-techne"
version = "0.20.0"
description = "Agentic memory and knowledge system for AI coding agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "tenish" }]
keywords = ["ai", "agents", "memory", "knowledge", "claude", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
    "structlog>=24.0",
]

[project.optional-dependencies]
vectors = [
    "sqlite-vec>=0.1.0",
    # fastembed pulls in onnxruntime, which currently has no Python 3.14 wheel.
    # Gate the dep so installing `tenish-techne[vectors]` succeeds on 3.14 (FTS-only;
    # vector search degrades to empty via the import guard in core/search.py).
    # Drop the marker when onnxruntime ships 3.14 wheels.
    "fastembed>=0.4.0; python_version < '3.14'",
    # model2vec/potion is the py3.14 embedding backend (techne#601/#602): numpy-only
    # static embeddings, no onnxruntime/torch dependency, so it installs where
    # fastembed can't. core/embeddings.py auto-selects between the two backends
    # (model2vec on 3.14+, fastembed on <3.14) — see EmbeddingBackend. Mirrors the
    # fastembed marker above so `[vectors]` gets a working backend on both sides
    # of the 3.14 boundary.
    # Capped, not open-ended: a bump past 0.9.x is deliberate, and
    # tests/test_static_direct.py is the equality tripwire that catches drift
    # in the encode() steps static_direct.py reimplements (Prudence, #1097 r1).
    "model2vec>=0.8.0,<0.10; python_version >= '3.14'",
    # Direct import in core/search.py and core/inference.py; currently satisfied
    # transitively via fastembed/model2vec but declared here to make the
    # dependency explicit.
    "numpy",
]
# `llm` enables the optional operator-model path for autonomous/headless
# reflect/consolidate/claims. The default resident emit/ingest path needs no
# model dep.
llm = ["litellm>=1.0"]
# `security` installs pip-audit for techne.security.shell_guard.audit_install
# (techne#120), a standalone helper. Nothing in techne calls shell_guard (techne has
# no shell-exec path), so this extra changes nothing techne does; it is for code that
# imports the helper. audit_install fails open when pip-audit is absent (#1263).
security = ["pip-audit>=2.7"]
# `watch` enables `techne watch <dir>` — continuous-ingest mode that
# observes filesystem changes and adds them as observations. Useful for
# code agents (the Codex persona) and for keeping a docs corpus current.
watch = ["watchdog>=4.0"]
# `rerank` enables the opt-in cross-encoder reranker for architect search
# (`architect.rerank: minilm`, core/rerank.py). numpy only, no torch or
# onnxruntime, so it installs on every platform techne supports. The model
# (91 MB) downloads from Hugging Face on first use.
rerank = ["numpy", "safetensors", "tokenizers", "huggingface_hub"]
# `codex` enables `techne codex index <repo>` — tree-sitter extraction of
# Python, TypeScript and Go symbols and call/import edges into codex.db (techne#89, #1284).
codex = [
    "tree-sitter>=0.25",   # source.py uses the QueryCursor API (landed in 0.25); <0.25 import-fails and silently no-ops the parser
    "tree-sitter-python>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-go>=0.25",  # 0.25.0 verified against tree-sitter 0.25.2 (techne#1284)
    "watchdog>=4.0",
]
# `recommended` is the convenience bundle behind the blessed pipx install in the
# README. Semantic recall + pip-audit (for the shell_guard helper, which techne does
# not call) — bundled together, minus the situational (watch daemon), headless-only (llm), and
# experimental (codex) ones. Self-referencing extra: pip (>=21.2) resolves
# `tenish-techne[...]` to the sibling extras above, so the set lives in exactly one place.
recommended = ["tenish-techne[vectors,security]"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    # The suite is syscall-heavy (#463): a full run measures sys 45s against
    # user 40s, dominated by per-test filesystem setup rather than by the
    # assertions. Note that is kernel CPU time, NOT I/O wait — user+sys is 85s
    # of 102s wall, so the suite is ~83% CPU-busy and the speedup ceiling is
    # core count. 101s -> 26s on 6 cores; ~2x on the retired 2-core runners.
    "pytest-xdist>=3.6",
    "ruff>=0.5.0",
    "litellm>=1.0",
]

[project.scripts]
techne = "techne.cli:main"

[project.entry-points."techne.sync_adapters"]
noop = "techne.sync.noop:NoopAdapter"
filesystem = "techne.sync.filesystem:FilesystemAdapter"

[project.urls]
Homepage = "https://github.com/tenishai/techne"
Repository = "https://github.com/tenishai/techne"
Issues = "https://github.com/tenishai/techne/issues"
Changelog = "https://github.com/tenishai/techne/blob/main/CHANGELOG.md"
Documentation = "https://github.com/tenishai/techne/tree/main/docs"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# B006 added as a regression guard (#720): zero findings on main when measured,
# so this is a no-op that starts REPORTING the first time a mutable default
# argument appears, rather than a backlog to clear. Reporting, not failing: CI
# runs ruff with `|| true` (test.yml), same as the rest of this list -- see the
# HEALTH line in ARCHITECTURE.md. E722 (bare except)
# and F821 (undefined name) were also proposed by #720 but are already covered
# by the "E"/"F" category prefixes above — verified by forcing both to fire
# against a scratch file under this exact select list.
select = ["E", "F", "I", "W", "B006"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Keep the recall eval (#68) out of the default unit run — it's run explicitly
# with `pytest -m eval`. Unit runs stay clean and fast.
addopts = "-m 'not eval and not probe and not eval_llm and not eval_gate and not eval_vec and not eval_scale and not crash'"
markers = [
    "crash: SIGKILL fault-injection recovery gate (#388); excluded from default runs, RUN BY THE `crash-recovery` CI job",
    "eval: recall-effectiveness eval cases (#68); excluded from default runs",
    "probe: memory-attribution probe that spawns a real session (#94); excluded from default runs",
    "eval_llm: LLM-judged eval cases (#118 Stage 2); needs a reachable model, else skipped",
    "eval_gate: retrieval-correctness regression gate (#385); excluded from default runs",
    "eval_vec: vector/hybrid retrieval gate + RRF-vs-simple ablation (#399); needs sqlite-vec + a cached model2vec model, else skipped",
    "eval_scale: the #399 gold set re-scored against a production-sized corpus (#883), plus the #945 channel/vocabulary/table/real-content arms; informational, not gated — same deps as eval_vec, RUN BY THE `eval-vec` CI job",
    "real_warm_vectors: runs init's real model-warming helper with the loader stubbed (#1021); every other test gets it stubbed by conftest",
    "real_install_context: runs the real _install_context()/_direct_url() against a faked importlib.metadata distribution (#1128); every other test gets _install_context() pinned by conftest",
]

[tool.hatch.build.targets.wheel]
# The distribution is tenish-techne; the import package is still `techne`, so
# name it here (hatchling would otherwise look for a tenish_techne/ package).
packages = ["techne"]

# Ship the OPERATOR-FACING guides inside the package (techne#754, 0.16.0).
#
# WHY THIS EXISTS. techne's agent education lives in markdown — the trigger blocks
# in these files are how an agent learns to raise a silent failure before the
# operator hits it (techne#1374). None of it shipped: the wheel carried code, two
# skills and two grammars, so every trigger reached agents working ON techne and
# nobody else. An installed user's agent saw the MCP tool list and nothing else,
# which is the "learned techne_* instead" failure 0.16.0 exists to fix.
#
# NOT THE WHOLE docs/ TREE. `docs/arch/` cards and `docs/proposals/` are
# contributor material — they describe seams to people changing them, and they
# carry anchor shas that mean nothing outside a git checkout. Shipping them would
# quadruple the payload to teach nobody. These seven are the ones an operator or
# their agent reads, and six of the seven carry trigger blocks.
[tool.hatch.build.targets.wheel.force-include]
"docs/four-functions.md" = "techne/docs/four-functions.md"
"docs/investigating.md" = "techne/docs/investigating.md"
"docs/surveying.md" = "techne/docs/surveying.md"
"docs/reflect-guide.md" = "techne/docs/reflect-guide.md"
"docs/db-per-domain.md" = "techne/docs/db-per-domain.md"
"docs/deployment.md" = "techne/docs/deployment.md"
"docs/welcome.md" = "techne/docs/welcome.md"
"docs/mcp-tools.md" = "techne/docs/mcp-tools.md"
"docs/releasing.md" = "techne/docs/releasing.md"
"docs/operator-guide.md" = "techne/docs/operator-guide.md"
"AGENTS.md" = "techne/docs/AGENTS.md"
