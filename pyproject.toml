[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "techne"
version = "0.6.0"
description = "Agentic memory and knowledge system for AI coding agents"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "Richard DiMartino" },
]
keywords = ["ai", "agents", "memory", "knowledge", "claude", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
    "litellm>=1.0",
]

[project.optional-dependencies]
vectors = [
    "sqlite-vec>=0.1.0",
    # fastembed pulls in onnxruntime, which currently has no Python 3.14 wheel.
    # Gate the dep so `pip install techne[vectors]` succeeds on 3.14 (FTS-only;
    # vector search degrades to empty via the import guard in core/search.py).
    # Drop the marker when onnxruntime ships 3.14 wheels.
    "fastembed>=0.4.0; python_version < '3.14'",
]
anthropic = ["anthropic>=0.40.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5.0",
]

[project.scripts]
techne = "techne.cli:main"

[project.entry-points."techne.sync_adapters"]
noop = "techne.sync.noop:NoopAdapter"
filesystem = "techne.sync.filesystem:FilesystemAdapter"

[project.urls]
Repository = "https://github.com/dimartin/techne"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
