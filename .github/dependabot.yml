# Dependabot version updates. Grouped so a week's bumps land as one PR, not
# one per package; every PR runs the full CI matrix on GitHub-hosted runners and
# billed minutes are the cost (techne#424/#461), so N near-identical runs are
# not wanted.
#
# NO `pip` ECOSYSTEM YET. A dependency-version bump runs arbitrary install-time
# code the day it is proposed, before review, on a hosted runner that gets the
# job's read-only token. That is a smaller exposure than it was on a runner of our
# own, but it is still a much larger and more frequently changing package set than
# the three pinned Actions. Add it as a deliberate decision, not by default.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
