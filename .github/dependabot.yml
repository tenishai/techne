# Dependabot version updates. Grouped per ecosystem so a week's bumps land as
# one PR each, not one per package — test.yml's self-hosted pool is small
# (techne#424/#461) and does not need N near-identical runs.
#
# Dependabot PRs from this config are SAME-REPO PRs (dependabot[bot] pushes to
# a branch in tenishai/techne, not a fork), so they satisfy test.yml's
# TRUSTED_POOL guard (tests/test_ci_workflow_triggers.py:703) exactly like a
# human contributor's PR and run on the self-hosted pool. See the PR body for
# what that means and why no guard change ships with this file.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-dependencies:
        patterns:
          - "*"
