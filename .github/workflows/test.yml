name: test

# Techne has no private sibling deps — full suite runs on every push/PR.
# The contract job catches breaking renames before cabal/limenal CI fires.
#
# RUNS ON A SELF-HOSTED RUNNER (dev02), not ubuntu-latest. Why: GitHub-hosted jobs
# on this org stopped STARTING in July 2026 — "recent account payments have failed
# or your spending limit needs to be increased", a scheduling refusal that reports
# as a plain `failure` with no runner assigned. Self-hosted dispatch is unaffected
# (verified empirically; see the agora write-up). Runner setup lives at
# /var/servers/gha-runner + /var/servers/docker-compose/ci on dev02.
#
# The runner image bakes python 3.12/3.13/3.14 + uv, so there is deliberately NO
# actions/setup-python here: the runner is EPHEMERAL, and setup-python would
# re-download every interpreter on every job rather than reusing a tool cache that
# does not survive the container.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Force uv to use the interpreters BAKED INTO THE RUNNER IMAGE and never fetch a
# managed build of its own (#424 review — Prudence). Without this the matrix claims
# to test 3.12/3.13/3.14 while potentially exercising whatever uv decided to
# download, and `python -V` cannot tell the two apart — it prints the same string
# either way.
#
# This has teeth on the eval-vec leg specifically. sqlite-vec is a loadable SQLite
# extension, and search.py degrades GRACEFULLY when the interpreter lacks
# loadable-extension support: search_vec returns [] and backfill_vectors returns {}
# (the guarded except at search.py:590/868, from #84). So an interpreter without
# that support does not crash the gate — it makes the gate quietly measure an
# FTS-only path while still reporting green. A silent wrong-interpreter is exactly
# the failure this pin prevents.
env:
  UV_PYTHON_PREFERENCE: only-system
  UV_PYTHON_DOWNLOADS: never

jobs:
  test:
    # NB: there is currently ONE runner, so these matrix legs and eval-vec run
    # SEQUENTIALLY rather than in parallel — expect ~30min wall-clock for the full
    # workflow, against ~2min when this ran on GitHub-hosted. Scale by starting
    # more replicas of the runner container if that becomes the bottleneck.
    runs-on: [self-hosted, linux, x64, dev02]
    # The default is 360 MINUTES. On a hosted runner a hung job was a local
    # nuisance; with ONE self-hosted runner it is an org-wide CI outage, because
    # every other job queues behind it (#424 review — Prudence). A full leg is
    # ~12min on this hardware, so 45 is generous headroom and still bounds the
    # blast radius at under an hour.
    timeout-minutes: 45
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
      fail-fast: false

    steps:
      - name: Checkout techne
        uses: actions/checkout@v4
        with:
          path: techne

      # uv + the interpreters are baked into the runner image. `uv venv --python`
      # selects the matrix version explicitly — without setup-python, a bare
      # `python` would NOT be the matrix version, so every step below runs through
      # the venv rather than relying on PATH.
      - name: Create venv on Python ${{ matrix.python-version }}
        working-directory: techne
        run: |
          uv venv --python ${{ matrix.python-version }} .venv-ci
          .venv-ci/bin/python -V

      - name: Install
        working-directory: techne
        # codex extra brings the tree-sitter grammars so the codex extraction tests
        # run (not skip) in CI.
        run: uv pip install --python .venv-ci/bin/python -e ".[dev,codex]"

      - name: Ruff lint
        working-directory: techne
        run: .venv-ci/bin/python -m ruff check techne tests || true  # advisory until strict pass is done

      - name: Pytest (includes contract assertions)
        working-directory: techne
        run: .venv-ci/bin/python -m pytest -q

      # (#398) Deterministic eval gates — FTS-only, no vector/LLM deps, ~0.5s.
      # A regression gate that nothing invokes protects nothing (Prudence, #397).
      # CLI -m overrides the addopts exclusion. eval_llm stays out (needs a key).
      - name: Deterministic eval gates (#68 recall, #385 retrieval-correctness)
        working-directory: techne
        run: .venv-ci/bin/python -m pytest -m "eval or eval_gate"

  # (#398) Vector/hybrid retrieval gate (#399/#401) on its own leg: it pins
  # model2vec, which the [vectors] extra installs only on py>=3.14, so it can't
  # run on the 3.12/3.13 matrix above. Kept separate so the deterministic gates
  # stay fast and dep-free.
  eval-vec:
    runs-on: [self-hosted, linux, x64, dev02]
    # Observed at ~30s on the runner; 20 bounds a hang without being tight.
    timeout-minutes: 20
    steps:
      - name: Checkout techne
        uses: actions/checkout@v4
        with:
          path: techne

      - name: Create venv on Python 3.14
        working-directory: techne
        run: |
          uv venv --python 3.14 .venv-ci
          .venv-ci/bin/python -V

      - name: Install (with vectors)
        working-directory: techne
        run: uv pip install --python .venv-ci/bin/python -e ".[dev,codex,vectors]"

      - name: Cache the pinned model2vec model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-model2vec-potion-base-8M

      - name: Pre-fetch potion-base-8M into the HF cache
        # The eval_vec fixture SKIPS unless the pinned model is already cached
        # (it probes with allow_download=False). Fetch it up front so the gate
        # actually RUNS in CI instead of silently skipping.
        # force_download=False so a restored cache is actually reused (model2vec
        # 0.8.2 defaults it to True — see embeddings.py:271); otherwise the
        # actions/cache step above would be dead weight. (#403 review — Prudence.)
        #
        # The cache matters MORE on the ephemeral runner than it did on hosted:
        # ~/.cache/huggingface lives inside the container and dies with each job,
        # so without a restore this re-downloads the model every single run.
        working-directory: techne
        run: .venv-ci/bin/python -c "from model2vec import StaticModel; StaticModel.from_pretrained('minishlab/potion-base-8M', force_download=False)"

      - name: eval_vec gate (#399/#401 — vector/hybrid retrieval + ablation)
        working-directory: techne
        run: .venv-ci/bin/python -m pytest -m eval_vec -s

  # (#383) Architecture-card freshness. Each card in ARCHITECTURE.md / docs/arch/*.md
  # pins the git blob sha of the seam file(s) it describes; this recomputes them and
  # fails when code drifted from its card — turning "detected staleness" into
  # visible-at-PR staleness. NOTE it cannot BLOCK: branch protection is unavailable
  # on this repo's plan (`gh api .../branches/main/protection` → 403), so no check
  # here is required. Red means "stop" by convention, not by enforcement.
  #
  # Same reasoning as the eval gates above: a regression gate that nothing invokes
  # protects nothing (Prudence, #397). This one was written 2026-07-20 and went
  # unwired until 2026-08-02, by which point 2 of 8 cards had silently drifted —
  # including a card carrying a GOTCHA that its own seam had since fixed.
  #
  # Its own unit tests (tests/test_arch_cards_gate.py) run in the matrix job; this
  # runs the gate against the REAL cards, which is the part those tests can't cover.
  # Stdlib-only and deterministic: no pip install, no extras, ~0.3s.
  arch-cards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout techne
        uses: actions/checkout@v4
        with:
          path: techne

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Architecture-card freshness gate
        working-directory: techne
        run: python scripts/check_arch_cards.py
