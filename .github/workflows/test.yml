name: test

# Techne has no private sibling deps — full suite runs on every push/PR.
# The contract job catches breaking renames before cabal/limenal CI fires.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
      fail-fast: false

    steps:
      - name: Checkout techne
        uses: actions/checkout@v4
        with:
          path: techne

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: techne/pyproject.toml

      - name: Install
        working-directory: techne
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,codex]"   # codex extra brings the tree-sitter grammars so the codex extraction tests run (not skip) in CI

      - name: Ruff lint
        working-directory: techne
        run: ruff check techne tests || true  # lint is advisory until strict pass is done

      - name: Pytest (includes contract assertions)
        working-directory: techne
        run: pytest -q

      # (#398) Deterministic eval gates — FTS-only, no vector/LLM deps, ~0.5s.
      # A regression gate that nothing invokes protects nothing (Prudence, #397).
      # CLI -m overrides the addopts exclusion. eval_llm stays out (needs a key).
      - name: Deterministic eval gates (#68 recall, #385 retrieval-correctness)
        working-directory: techne
        run: pytest -m "eval or eval_gate"

  # (#398) Vector/hybrid retrieval gate (#399/#401) on its own leg: it pins
  # model2vec, which the [vectors] extra installs only on py>=3.14, so it can't
  # run on the 3.12/3.13 matrix above. Kept separate so the deterministic gates
  # stay fast and dep-free.
  eval-vec:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout techne
        uses: actions/checkout@v4
        with:
          path: techne

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: techne/pyproject.toml

      - name: Install (with vectors)
        working-directory: techne
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,codex,vectors]"

      - name: Cache the pinned model2vec model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-model2vec-potion-base-8M

      - name: Pre-fetch potion-base-8M into the HF cache
        # The eval_vec fixture SKIPS unless the pinned model is already cached
        # (it probes with allow_download=False). Fetch it up front so the gate
        # actually RUNS in CI instead of silently skipping.
        # force_download=False so a restored cache is actually reused (model2vec
        # 0.8.2 defaults it to True — see embeddings.py:271); otherwise the
        # actions/cache step above would be dead weight. (#403 review — Prudence.)
        working-directory: techne
        run: python -c "from model2vec import StaticModel; StaticModel.from_pretrained('minishlab/potion-base-8M', force_download=False)"

      - name: eval_vec gate (#399/#401 — vector/hybrid retrieval + ablation)
        working-directory: techne
        run: pytest -m eval_vec -s

  # (#383) Architecture-card freshness. Each card in ARCHITECTURE.md / docs/arch/*.md
  # pins the git blob sha of the seam file(s) it describes; this recomputes them and
  # fails when code drifted from its card — turning "detected staleness" into
  # visible-at-PR staleness. NOTE it cannot BLOCK: branch protection is unavailable
  # on this repo's plan (`gh api .../branches/main/protection` → 403), so no check
  # here is required. Red means "stop" by convention, not by enforcement.
  #
  # Same reasoning as the eval gates above: a regression gate that nothing invokes
  # protects nothing (Prudence, #397). This one was written 2026-07-20 and went
  # unwired until 2026-08-02, by which point 2 of 8 cards had silently drifted —
  # including a card carrying a GOTCHA that its own seam had since fixed.
  #
  # Its own unit tests (tests/test_arch_cards_gate.py) run in the matrix job; this
  # runs the gate against the REAL cards, which is the part those tests can't cover.
  # Stdlib-only and deterministic: no pip install, no extras, ~0.3s.
  arch-cards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout techne
        uses: actions/checkout@v4
        with:
          path: techne

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Architecture-card freshness gate
        working-directory: techne
        run: python scripts/check_arch_cards.py
