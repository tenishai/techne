name: test

# Techne has no private sibling deps — full suite runs on every push/PR.
# The contract job catches breaking renames before cabal/limenal CI fires.
#
# Every job on the TRUSTED path is self-hosted (#424, #461) — do not add a hosted
# one there. Hosted jobs here can fail to START: July 2026 billing refusal reported
# `failure` (probe 764f160, which also showed self-hosted unaffected), the
# 2026-08-06 outage reported `cancelled` at 901s while the self-hosted legs of the
# same runs queued and ran on recovery. Neither cleared by a rerun.
#
# THE ONE EXCEPTION IS `fork-pr`, AND IT IS A SECURITY BOUNDARY, NOT A REGRESSION
# (#556): fork PRs must not execute on the self-hosted pool, so they are routed to a hosted runner
# and accept the scheduling risk above. See the trust-split block below `env:`.
# `techne-ci` is a POOL LABEL, not a host — deliberately NOT named after one.
# It replaced a host-named label on 2026-09-06, which had outlived its host by
# three weeks: that host was retired as a CI host on 2026-08-16 and the label
# was kept so this file would not have to change. That saved one edit and cost a
# long detour later, where the stale name and this comment sent a reader
# reasoning about 2-physical-core boxes and cpus:"3" containers that no longer
# existed.
#
# "ROTS" IS THE WRONG WORD, and the right one is the point: the old label never
# stopped working. Jobs routed correctly the whole time. What decayed was the
# name's TRUTHFULNESS, silently, while every run stayed green — which is why it
# cost a day rather than five minutes. A label that BROKE would have been fixed
# the same afternoon. Name a pool for its role, so the name cannot quietly stop
# describing the thing while continuing to work.
#
# THE OLD LABEL STAYS ON THE RUNNERS PERMANENTLY as a compatibility label, and that is
# a decision rather than an omission. All 14 tags carry it and every pre-merge
# run would become non-re-runnable without it, so the exposure never resolves by
# waiting. The harm was never the string: it was that HEAD TARGETED it, so a
# reader of this file was reading a host name and reasoning about that host. A
# label nothing at HEAD targets misleads nobody reading HEAD — inert, not lying.
#
# WHAT WOULD LET IT GO: nothing needs it once no reachable ref targets it, i.e.
# when the last tag and workflow-run predating 2026-09-06 stops mattering.
# WHAT IT DOES NOT BUY: it removes ONE reason an old re-run fails, not all of
# them — that era's interpreters and pins come from a runner image rebuilt on a
# different cadence by a different process than anything in this repo.
#
# THE POOL TODAY: TWO ephemeral runner instances on one host, each container
# cpus:"12" and 24g. Host, hardware and paths are deliberately not in this file:
# it ships with the public repo (#1005).
#
# The runner image bakes python 3.12/3.13/3.14 + uv, so the self-hosted jobs
# deliberately use NO actions/setup-python.
#
# STATE THE COST HONESTLY (techne#780). This comment used to say the runner is
# EPHEMERAL and that setup-python would re-download every interpreter ON EVERY JOB.
# Both are false. The REGISTRATION is ephemeral -- the runner deregisters after each
# job -- but the CONTAINER is not: `restart: unless-stopped` reuses it for hundreds
# of jobs (RestartCount 847 before its last replacement). setup-python installs into
# the runner tool cache, which is an ordinary directory in that container's writable
# layer. The observation that carries this: the container has ZERO mounts, so
# `_work/_tool` is in the writable layer and setup-python would download once per
# CONTAINER, not once per job. (RUNNER_TOOL_CACHE being unset in a `docker exec`
# shell proves nothing -- the runner sets it PER JOB -- and /opt/hostedtoolcache is
# the hosted-runner path, expected to be absent. Do not lean on either.)
#
# THE REASON THAT SURVIVES IS PROVENANCE, NOT COST -- the cost argument is
# falsified above and provenance is what is left standing. Stated that way on
# purpose: the two claims this replaces were FALSIFIABLE ("ephemeral", "every
# job") and were checked against RestartCount and mount state. "This is the
# reason" is a claim about a decision, which the tree cannot witness -- and an
# unfalsifiable claim written in the register of a verified one is how both of
# the previous versions got their confidence. Specifically NOT the only-system pin:
# `fork-pr` uses actions/setup-python under the SAME workflow-level
# UV_PYTHON_PREFERENCE=only-system / UV_PYTHON_DOWNLOADS=never and passes, because
# setup-python puts its interpreter on PATH as a SYSTEM one -- this file says so at
# the fork-pr job. So "the interpreters must be on the system" is equally true of the
# option it would be offered as a reason to reject. What distinguishes them is WHO
# BUILT THEM: image-baked interpreters are the operator's, where setup-python
# resolves `3.12` to whatever patch actions/python-versions serves at download time,
# over network egress from a host this file already treats as a trust boundary
# (techne#556). `fork-pr` DOES use it, because a
# hosted runner bakes in neither uv nor the matrix interpreters — the reasoning
# above is about this image, not a blanket ban (#556).
# NO `branches:` FILTER ON pull_request, AND THAT ABSENCE IS LOAD-BEARING (#530).
# The filter matches a PR's BASE, not its head, so `branches: [main]` meant a
# STACKED PR (base = another feature branch) matched no trigger and got NO CI AT
# ALL — not the test matrix, not eval-vec, not arch-cards, since all three jobs
# live in this one file. Measured on #526: zero runs ever created, while every
# base=main PR open at the same moment ran normally.
#
# WHAT MAKES IT DANGEROUS RATHER THAN MERELY MISSING: there is no red X and no
# skipped row. The Checks tab is EMPTY, which reads identically to "nothing to
# report" (techne#488's shape, in our own CI config). And branch protection
# cannot backstop it — required status checks are unavailable on this repo's plan
# (`gh api .../branches/main/protection` -> 403 "Upgrade to GitHub Pro or make
# this repository public"), so this trigger is the ONLY mechanism.
#
# STACKING IS FORCED BY OUR OWN CONVENTIONS, so this is not an edge case: two PRs
# touching one card-anchored source file must both bump the same `anchor:` sha in
# docs/arch/liveness.md, and two migrations must both edit SCHEMA_VERSION — both
# guaranteed conflicts that stacking is the normal answer to.
#
# REJECTED: adding `fix/*`/`feat/*` to the base filter — a hand-maintained list of
# branch names is a copy of a convention nothing enforces, and it fails silently
# the first time someone picks a name outside it. That is the trap that produced
# this issue. Also rejected: documenting "stacked PRs need workflow_dispatch" — a
# discipline, not a mechanism, failing the same way, by requiring someone to notice.
#
# COST, measured before removing it (2026-08-08): a base=main PR gets exactly ONE
# pull_request run per sha, and `push` fires only on main, so dropping the filter
# adds runs ONLY for stacked PRs — which today get zero. It doubles nothing.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Force uv to use the interpreters BAKED INTO THE RUNNER IMAGE and never fetch a
# managed build of its own (#424 review — Prudence). Without this the matrix claims
# to test 3.12/3.13/3.14 while potentially exercising whatever uv decided to
# download, and `python -V` cannot tell the two apart — it prints the same string
# either way.
#
# This has teeth on the eval-vec leg specifically. sqlite-vec is a loadable SQLite
# extension, and search.py degrades GRACEFULLY when the interpreter lacks
# loadable-extension support: search_vec returns [] and backfill_vectors returns {}
# (the guarded except at search.py:590/868, from #84). So an interpreter without
# that support does not crash the gate — it makes the gate quietly measure an
# FTS-only path while still reporting green. A silent wrong-interpreter is exactly
# the failure this pin prevents.
env:
  UV_PYTHON_PREFERENCE: only-system
  UV_PYTHON_DOWNLOADS: never

# >>> THE FLIP SEQUENCE LIVES IN docs/go-public-runbook.md. READ IT BEFORE MAKING
# >>> THIS REPO PUBLIC. The single most important step happens BEFORE the flip and
# >>> is not in this file: STOP THE RUNNER CONTAINER. A job whose labels match no
# >>> ONLINE runner queues rather than executing, which is what actually closes the
# >>> window between "public" and "approval policy applied" — being quick does not.
#
# TRUST SPLIT (#556). `pull_request:` above is deliberately unfiltered, so it fires
# for FORK PRs too. Combined with `runs-on: [self-hosted, ...]` that is arbitrary
# attacker code on the CI host the moment this repo goes public — GitHub's own guidance
# is "only use self-hosted runners with private repositories".
#
# SCOPE — THIS IS DEFENCE IN DEPTH, NOT THE WHOLE CONTROL, and the distinction is
# not modesty. The complementary control is GitHub's fork-PR contributor approval
# policy, and it CANNOT BE PRE-STAGED: on a private repo the API refuses it.
# Verified 2026-08-16 with an admin token:
#     gh api repos/tenishai/techne/actions/permissions/fork-pr-contributor-approval
#     -> 422 "Fork PR approval is not allowed for private repositories."
# It only becomes settable AFTER the public flip — i.e. inside the very window it
# is meant to protect. So it is a FIRST-ACTION-POST-FLIP runbook item on #556, not
# a pre-flip checkbox.
#
# *** THIS GUARD IS ATTACKER-EDITABLE, AND THAT IS NOT A CAVEAT — IT IS THE SCOPE. ***
# For `pull_request`, GitHub evaluates the workflow FROM THE PR'S REF, not from the
# base. MEASURED on this branch: run 31971484190 (event `pull_request`, head_sha
# 124040e) executed an `expr-probe` job that existed ONLY on the PR's branch. So a
# fork PR runs the fork's copy of THIS FILE — an attacker deletes the three `if:`
# guards, or simply adds their own `pwn.yml` targeting the pool, and none of the
# machinery below applies to them.
#
# AGAINST A DELIBERATE ATTACKER THIS GUARD CONTRIBUTES NOTHING. What it does buy is
# NON-ADVERSARIAL exposure: an honest fork PR that would otherwise run on the pool by
# default, and CI coverage for fork contributors via `fork-pr`. That is worth having
# and it is all this is.
#
# SO THE PRE-FLIP RUNBOOK ACTION IS NOT "RELY ON THIS GUARD" — that is the one thing
# that does not work. It is: STOP THE RUNNER CONTAINER until the fork-PR approval
# policy is settable (i.e. until after the flip), then start it again. De-registering
# alone does not stick: an ephemeral runner's entrypoint re-registers on start
# (docs/go-public-runbook.md). Unlike the approval policy, stopping IS available pre-flip.
#
# So: every self-hosted job carries the SAME fork guard, and fork PRs are served by
# `fork-pr` on a GitHub-hosted runner instead. Non-fork PRs and `push` on main are
# unchanged — which keeps the measured cost decision behind the self-hosted pool
# (#461) intact rather than undoing it.
#
# THE GUARD FAILS CLOSED, AND THE SPELLING IS THE MECHANISM (#570 step 3). It is a
# POSITIVE IDENTITY CHECK — `head.repo.full_name == github.repository` — not a negated
# truthiness test on `head.repo.fork`.
#
# THESE VALUES ARE MEASURED, NOT DERIVED, and that matters because two rounds of
# deriving them from the reference pages produced two different wrong answers. A
# temporary job ran these expressions under a real `pull_request` event and emitted
# toJSON of each; the output is checked in at
# tests/fixtures/github/expression_truth_table.json with its provenance:
#
# EVERY ROW BELOW WAS MEASURED IN ONE CONTEXT: a NON-FORK `pull_request` on this repo.
# TWO KINDS OF CONTEXT-DEPENDENCE, and they are NOT the same axis (techne#591 —
# an earlier version of this table marked one row that cannot vary and omitted one
# that does). [fork] varies with WHO opened the PR; [push] varies with WHICH EVENT.
#
#   an absent property is            null      (NOT the empty string)
#   <absent> == github.repository    false     <- the NEW guard's comparison
#   <absent> == false                true      <- why `fork == false` is NOT a fix
#   head.repo.fork == false                                              true   [fork]
#   OLD  !(event_name=='pull_request' && <absent>)                       true   FAIL OPEN
#   NEW  event_name!='pull_request' || <absent>==github.repository       false  [push] FAIL CLOSED
#   NEW  event_name!='pull_request' || full_name==github.repository      true   [fork] [push]
#   FORK_ONLY event_name=='pull_request' && <absent>!=github.repository  true   [push]
#
# THE [fork] ROWS INVERT ON A FORK PR, and that inversion IS the feature: the NEW guard
# reads `true` above only because this was a same-repo PR — on a fork it is FALSE, which
# is what keeps fork code off the CI host. Do not "fix" it to true.
#
# FORK_ONLY IS *NOT* [fork], which is the correction #591 filed: both of its operands
# are fork-invariant. `<absent> != github.repository` is `null != "tenishai/techne"` —
# true in EVERY context, because the property is absent from the payload rather than
# holding a fork's name. It varies only with the EVENT.
#
# THE THREE `<absent>` ROWS CARRYING `event_name` ARE NOT UNIFORM UNDER `push`, and the
# old blanket "expected to be context-independent" hid the difference. Under `push`:
#   NEW-with-<absent>  false -> TRUE   (the `event_name != 'pull_request'` disjunct wins)
#   FORK_ONLY          true  -> FALSE  (the `event_name == 'pull_request'` conjunct fails)
#   OLD                true  -> true   UNCHANGED — the negation absorbs it either way,
#                                      which is exactly why the OLD guard failed open
#                                      no matter what event arrived.
#
# AND THE ROW THE SECURITY CLAIM RESTS ON HAS NEVER BEEN MEASURED IN ANY CONTEXT:
# nobody has yet observed `fork-pr` actually fire, because no fork of this repo exists.
# The fork-side behaviour is a HAND TRACE. One fork PR from a personal account would
# convert it to measured; until then, say "expected" rather than "verified" about it.
#
# So a typo'd property under the OLD guard ran fork code on the CI host, silently; under the
# NEW guard the self-hosted job is SKIPPED. A mistake now costs a visibly missing job
# instead of arbitrary code execution on a persistent host. `fork == false` looks like
# the obvious fix and is not one: an absent property equals false, so it fails open too.
#
# THE GUARD IS AN ALLOW-LIST NOW, NOT A DENYLIST (techne#590, 2026-08-18). It reads
# "push OR workflow_dispatch OR (pull_request AND head repo is us)". The old shape
# opened with `event_name != 'pull_request'`, A DENYLIST OF ONE NAME: any other
# event carrying a `pull_request` payload — notably `pull_request_target`, which
# runs with full secrets — satisfied that disjunct and short-circuited the guard
# TRUE, putting fork code on the self-hosted pool.
#
# #570 policed that with a hand-maintained list of fork-carrying event names in the
# test file. That is the same hazard one level up, and it had already failed: the
# list omitted `pull_request_review_thread`, whose payload carries `pull_request`
# as a REQUIRED property (verified against GitHub's payload docs 2026-08-18). A
# copy of a fact GitHub owns goes stale the first time GitHub adds an event — the
# same reasoning this file already records for refusing a hand-maintained BRANCH
# list (#530). The list is deleted; the allow-list makes it unnecessary.
#
# AN UNKNOWN EVENT NOW FAILS CLOSED — it satisfies no disjunct, so the self-hosted
# job SKIPS and the hosted `fork-pr` job (the exact complement, `!(...)` of the same
# string) picks it up. Proven by EVALUATION, not grep: tests/gha_expr.py implements
# the expression semantics and is validated against this repo's measured truth
# table, then tests/test_ci_workflow_triggers.py runs both guards over synthetic
# contexts including events GitHub has not invented yet.
#
# The composite expression below has NOT itself been observed in a live run; its
# primitives have. Treat it as hand-traced-from-measured-parts until a fork PR
# exercises it.
#
# THE GUARD IS REPEATED THREE TIMES AND THAT IS A HAZARD, not a style choice: this
# finding was first raised against TWO jobs on 2026-07-30 and had grown to THREE by
# 2026-08-12, because a new job inherits the runner and not the guard. GitHub
# Actions has no anchor/alias support to define it once, so the invariant is
# enforced in the suite instead — tests/test_ci_workflow_triggers.py asserts that NO
# fork-reachable job targets a self-hosted runner. Add a self-hosted job without the
# guard and that test fails. Do not delete it in favour of a comment; a comment is
# what let this regrow twice.

jobs:
  test:
    # Legs distribute across the pool: one host running TWO instances
    # each with cpus:"12". Both get the full thread count rather than a 6/6
    # split — what techne#769 measured was cgroup THROTTLING, and partitioning
    # reintroduces it at a lower cap on both halves. A ceiling is not a
    # reservation: one job alone bursts to 12, two are fair-shared.
    #
    # A THIRD INSTANCE WILL HELP LESS THAN THE SECOND DID. Measured 2026-09-06,
    # two runs each: 1 runner 301s mean -> 2 runners 233s/232s, ~23%. The suite
    # is CPU-bound, so concurrent jobs SHARE threads rather than each getting
    # them (test 3.12: 92s alone, 145s contended). No idle CPU is left.
    runs-on: [self-hosted, linux, x64, techne-ci]
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
    # Bound it: a hung job starves the small pool (#424). Legs are ~6-12min.
    timeout-minutes: 45
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
      fail-fast: false

    steps:
      - name: Checkout techne
        uses: actions/checkout@v4
        with:
          path: techne

      # MAKE `origin/main` RESOLVE, because a shipped check reads it (techne#690).
      # `doctor`'s `runtime:revision` runs `git rev-parse --short origin/main` and
      # returns UNKNOWN when it fails (checks.py), which fails four test_cli_doctor
      # tests and the whole job. On a PUSH the checked-out ref IS main, so it
      # resolves; on a PULL_REQUEST actions/checkout fetches only the merge ref at
      # depth 1 and `origin/main` does not exist locally.
      #
      # THIS PASSED FOR MONTHS ON LEFTOVER STATE, which is the part worth recording.
      # `actions/checkout` fetches into an EXISTING repo dir rather than re-cloning,
      # and the self-hosted runner container had been up for days with a `_work`
      # clone that had accumulated `origin/main` from earlier main-branch runs. Every
      # PR silently inherited that ref. Recreating the container on 2026-08-26 wiped
      # `_work`, and every PR run failed from that moment while `main` stayed green —
      # a clean before/after at 13:20Z across four branches.
      #
      # One ref, depth 1: enough for the comparison, and not a full-history clone.
      # KNOWN COST of --depth=1 (Prudence, #779 Nit 3): the two histories are then
      # disjoint, `git merge-base` finds nothing, and `rev-list --left-right --count`
      # returns 1 1. So the CI log's "N commit(s) behind origin/main" (checks.py) is
      # an artifact, not a distance. The VERDICT is unaffected -- DORMANT is reached
      # via the branch gate, not the count -- but do not read that number off a CI log.
      - name: Fetch origin/main for runtime:revision
        working-directory: techne
        run: git fetch --depth=1 origin +refs/heads/main:refs/remotes/origin/main

      # uv + the interpreters are baked into the runner image. `uv venv --python`
      # selects the matrix version explicitly — without setup-python, a bare
      # `python` would NOT be the matrix version, so every step below runs through
      # the venv rather than relying on PATH.
      - name: Create venv on Python ${{ matrix.python-version }}
        working-directory: techne
        run: |
          uv venv --python ${{ matrix.python-version }} .venv-ci
          .venv-ci/bin/python -V

      - name: Install
        working-directory: techne
        # codex extra brings the tree-sitter grammars so the codex extraction tests
        # run (not skip) in CI.
        #
        # `vectors` added for #535: WITHOUT IT, VECTOR TESTS RAN IN NEITHER LEG.
        # This leg runs everything but had no vector backend, so they SKIPPED;
        # eval-vec has the backend but runs `-m eval_vec` only, so they were never
        # SELECTED. Six files fell through the gap — test_inference, test_search,
        # test_embeddings, test_cli_vectors, test_checks, test_documents — none of
        # which carry the eval_vec marker. Measured, not estimated.
        run: uv pip install --python .venv-ci/bin/python -e ".[dev,codex,vectors]"

      # THE EXTRA ALONE IS NOT THE FIX, and shipping it alone would have been
      # #535 again in a new costume: `backend_available()` only tests
      # IMPORTABILITY, so the extra un-skips the tests — but the ones that matter
      # then EMBED FOR REAL (test_cli_vectors.py:56 says so in as many words:
      # "exercises the real backfill_vectors() path, not a mock"), and an
      # un-cached model means a re-download once per container per matrix entry --
      # NOT once per job (techne#780). `~/.cache/fastembed` is in the container's
      # writable layer, which survives every job on that container. This said "every
      # job on every matrix entry" until 2026-08-26; the identical sentence in the
      # fork-pr job IS true and should stay, because that job is ubuntu-latest -- a
      # fresh VM per job.
      # model2vec 0.8.2 defaults force_download=True (embeddings.py:271), so
      # without force_download=False a restored cache is dead weight — that is
      # Prudence's #403 finding, reused here rather than rediscovered.
      #
      # THE BACKEND HERE IS NOT model2vec, AND ASSUMING IT WAS COST A RED BUILD.
      # `[vectors]` is SPLIT AT THE 3.14 BOUNDARY (techne#601, pyproject.toml:38/45):
      #   python <  3.14  -> fastembed   (onnxruntime has no 3.14 wheel)
      #   python >= 3.14  -> model2vec
      # This matrix is 3.12/3.13, so it gets FASTEMBED. eval-vec pins 3.14, which
      # is why the identical model2vec pre-fetch works there and blew up here with
      # ModuleNotFoundError on the first run of this change.
      #
      # So the pre-fetch has to match the backend the resolver actually chose for
      # this interpreter, not the one the other job uses. Model name from
      # embeddings.py:72 (_DEFAULT_FASTEMBED_MODEL) rather than retyped — a second
      # copy of that string would drift the first time the default changes.
      - name: Cache the fastembed model
        uses: actions/cache@v4
        with:
          # fastembed caches ONNX weights here, not in ~/.cache/huggingface.
          # Deliberately a DIFFERENT key from eval-vec's: different backend,
          # different artifact. Sharing one key would let a 3.14 model2vec cache
          # satisfy a 3.12 fastembed restore and leave the real download to run.
          path: ~/.cache/fastembed
          key: fastembed-${{ matrix.python-version }}-all-MiniLM-L6-v2

      - name: Pre-fetch the embedding model
        working-directory: techne
        # CALLS THE PRODUCTION ENTRY POINT, and that is the whole fix. An earlier
        # version constructed `TextEmbedding(model_name=...)` itself, deriving the
        # model name from the module but NOT the cache directory — and
        # `_build_backend` (embeddings.py:231-237) constructs, mkdirs and passes
        # `cache_dir=~/.cache/fastembed` explicitly. So the pre-fetch warmed
        # fastembed's default location while the tests read a different one: the
        # step ran, passed, and bought a second full download per job.
        #
        # IT ALSO PRODUCED A FALSE EXPLANATION. The four failures on #535's first
        # green run were blamed on "the model not being pre-fetched"; the workflow
        # was in fact BYTE-IDENTICAL between that run and the passing one (`git
        # diff 0f5f4a2 e00e4c5` touches tests/ only). The only difference was
        # actions/cache going MISS -> HIT, populated at post-job BY THE TESTS.
        # Which means the suite was passing on a warm cache and would have gone
        # red on the first cold one — a python bump, a model rename, or 7-day
        # eviction — landing on an unrelated PR wearing a JSONDecodeError.
        #
        # `_get_embedding_model()` cannot drift from the code under test: same
        # backend selection (so this is correct on BOTH sides of the 3.14
        # fastembed/model2vec split), same model, same cache_dir, by construction.
        # allow_download defaults True, which is what a pre-fetch wants.
        run: .venv-ci/bin/python -c "from techne.core.embeddings import _get_embedding_model; m = _get_embedding_model(); print('prefetched', m.name)"

      - name: Ruff lint
        working-directory: techne
        run: .venv-ci/bin/python -m ruff check techne tests || true  # advisory until strict pass is done

      # Parallel test execution (#463). This step was 97.5% of the job — 654s of
      # a 671s run, against ~5s for checkout+venv+install+ruff combined (the
      # balance is GitHub Actions job setup/teardown).
      #
      # WHY IT IS SLOW, stated precisely — an earlier draft of this comment got
      # it wrong and mispredicted this runner by 2x, so read the numbers before
      # tuning. A local run measures real 102.05 / user 39.60 / sys 45.45:
      # user+sys is 85s against 102s wall, i.e. ~83% CPU-BUSY with only ~17s of
      # genuine waiting. The suite is syscall-heavy (per-test filesystem setup
      # dominates), but kernel CPU time in getdents/mkdir/stat is CPU work — it
      # COMPETES for cores, it does not overlap with itself. So this is not
      # I/O-wait that parallelism hides; the speedup ceiling is CORE COUNT.
      #
      # The model held on the RETIRED 2-physical-core runner: 654s / 2 ~= 327s
      # against 317s actual, where the discarded "overlap the I/O" model
      # predicted ~165s. Those numbers are kept as the evidence FOR the model,
      # not as a prediction for this pool — it has more cores, and the same jobs
      # now run 102s and 122s. What transfers is the CLAIM (the ceiling is core
      # count), not the figures.
      #
      # WORKER COUNT IS PINNED, not `auto`, for the same reason this workflow
      # pins UV_PYTHON_PREFERENCE above: CI must not silently run something
      # other than what it claims. `auto` resolves from the host at runtime and
      # moves without anyone editing this file — inside a container it follows
      # CPU AFFINITY, which `--cpus` does not constrain (only `--cpuset-cpus`
      # does), and it drops to PHYSICAL cores if `psutil` ever arrives as a
      # transitive dep. 4 matches what was measured here; change it
      # deliberately. NOTE the pin does NOT bound total concurrency: two
      # instances at -n 4 put 8 workers on one host at any pin (see the jobs
      # comment above), so replicas are not an argument for pinning either way.
      # On 12 threads that is fine; it was not on the retired 2-core hosts.
      #
      # NOT applied to the eval gates below or to eval-vec: both select exactly
      # 2 tests (verified via --collect-only), where worker startup costs more
      # than it saves, and eval-vec additionally runs with `-s`, which xdist
      # does not support.
      - name: Pytest (includes contract assertions)
        working-directory: techne
        # `-rs` PRINTS THE SKIP REASONS. Without it this leg reports a bare
        # "N skipped" and nobody can say WHICH — the exact condition that let
        # #535 hide six files of vector tests for months. A count is not a
        # report: an unexplained skip reads as "nothing to see" in precisely the
        # way techne#488 is about. Local runs skip 18 and CI skipped 5, and until
        # this flag existed there was no way to know whether those five were the
        # harmless ones.
        run: .venv-ci/bin/python -m pytest -q -rs -n 4

      # (#398) Deterministic eval gates — FTS-only, no vector/LLM deps, ~0.5s.
      # A regression gate that nothing invokes protects nothing (Prudence, #397).
      # CLI -m overrides the addopts exclusion. eval_llm stays out (needs a key).
      - name: Deterministic eval gates (#68 recall, #385 retrieval-correctness)
        working-directory: techne
        run: .venv-ci/bin/python -m pytest -m "eval or eval_gate"

  # (#398) Vector/hybrid retrieval gate (#399/#401) on its own leg: it pins
  # model2vec, which the [vectors] extra installs only on py>=3.14, so it can't
  # run on the 3.12/3.13 matrix above. Kept separate so the deterministic gates
  # stay fast and dep-free.
  eval-vec:
    runs-on: [self-hosted, linux, x64, techne-ci]
    # Fork guard (#556) — see the block above `jobs:`.
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
    # Observed at ~30s on the runner; 20 bounds a hang without being tight.
    timeout-minutes: 20
    steps:
      - name: Checkout techne
        uses: actions/checkout@v4
        with:
          path: techne

      # MAKE `origin/main` RESOLVE, because a shipped check reads it (techne#690).
      # `doctor`'s `runtime:revision` runs `git rev-parse --short origin/main` and
      # returns UNKNOWN when it fails (checks.py), which fails four test_cli_doctor
      # tests and the whole job. On a PUSH the checked-out ref IS main, so it
      # resolves; on a PULL_REQUEST actions/checkout fetches only the merge ref at
      # depth 1 and `origin/main` does not exist locally.
      #
      # THIS PASSED FOR MONTHS ON LEFTOVER STATE, which is the part worth recording.
      # `actions/checkout` fetches into an EXISTING repo dir rather than re-cloning,
      # and the self-hosted runner container had been up for days with a `_work`
      # clone that had accumulated `origin/main` from earlier main-branch runs. Every
      # PR silently inherited that ref. Recreating the container on 2026-08-26 wiped
      # `_work`, and every PR run failed from that moment while `main` stayed green —
      # a clean before/after at 13:20Z across four branches.
      #
      # One ref, depth 1: enough for the comparison, and not a full-history clone.
      # KNOWN COST of --depth=1 (Prudence, #779 Nit 3): the two histories are then
      # disjoint, `git merge-base` finds nothing, and `rev-list --left-right --count`
      # returns 1 1. So the CI log's "N commit(s) behind origin/main" (checks.py) is
      # an artifact, not a distance. The VERDICT is unaffected -- DORMANT is reached
      # via the branch gate, not the count -- but do not read that number off a CI log.
      - name: Fetch origin/main for runtime:revision
        working-directory: techne
        run: git fetch --depth=1 origin +refs/heads/main:refs/remotes/origin/main

      - name: Create venv on Python 3.14
        working-directory: techne
        run: |
          uv venv --python 3.14 .venv-ci
          .venv-ci/bin/python -V

      - name: Install (with vectors)
        working-directory: techne
        run: uv pip install --python .venv-ci/bin/python -e ".[dev,codex,vectors]"

      - name: Cache the pinned model2vec model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-model2vec-potion-base-8M

      - name: Pre-fetch potion-base-8M into the HF cache
        # The eval_vec fixture SKIPS unless the pinned model is already cached
        # (it probes with allow_download=False). Fetch it up front so the gate
        # actually RUNS in CI instead of silently skipping.
        # force_download=False so a restored cache is actually reused (model2vec
        # 0.8.2 defaults it to True — see embeddings.py:271); otherwise the
        # actions/cache step above would be dead weight. (#403 review — Prudence.)
        #
        # The cache matters LESS here than on a hosted runner, and still matters --
        # for a reason that is NOT just "replacements are rare".
        #
        # Hosted is a fresh VM per job: always cold, one cold job in one. Here the
        # cache is in the container's writable layer and survives every job ON THAT
        # CONTAINER -- RestartCount reached 847 in one container's life, and with an
        # ephemeral registration a restart is roughly a job, so call it one cold job
        # in 847. Eviction does not change that: GitHub's 7-day and 10 GB limits
        # apply to the REMOTE entry, never to the writable-layer copy.
        #
        # TWO COLD TRIGGERS, NOT ONE. A container replacement is the obvious one —
        # rare, not routine: see "one cold job in 847" above. (An earlier version
        # of this line said "the runners are EPHEMERAL, so that is every job",
        # which is the claim :534-536 records as CORRECTED TWICE. The
        # REGISTRATION is ephemeral; the CONTAINER is not. Drawing the second
        # from the first is exactly the inference this file already deleted.)
        # The other is
        # `techne-ci` being a POOL LABEL (see the top of this file): legs distribute
        # across INSTANCES, so a job landing on one that has not served this matrix
        # entry finds nothing, however warm its sibling is. Both instances sit on one
        # host today, so this is instance-level rather than host-level — actions/cache
        # is what carries a warm cache across either, and a second host would restore
        # the cross-host case without changing anything here.
        #
        # CORRECTED TWICE (techne#780). It first said "dies with each job", the claim
        # the 2026-08-26 incident falsified -- a container up three days discarded
        # neither `_work` nor this cache. The first correction removed that premise
        # but kept the "matters MORE" comparison it was the only support for, which
        # inverts once the premise goes (Prudence, #779 r2 I2).
        #
        # Bears on the #535 analysis further up this FILE, in the `test` job (there
        # is none in this one): cold-cache runs are RARER
        # than that note assumes, so it understates its own case rather than
        # overstating it. (An earlier version of this pointed at the actions/cache
        # step itself, which makes no persistence claim at all -- the claim was in the
        # fastembed pre-fetch comment in the `test` job, now corrected. Mis-aiming a
        # pointer inside the very sentence recording a mis-aimed pointer is not a
        # coincidence worth repeating; check the job bounds before writing "above".)
        working-directory: techne
        run: .venv-ci/bin/python -c "from model2vec import StaticModel; StaticModel.from_pretrained('minishlab/potion-base-8M', force_download=False)"

      # techne#1096 — the direct potion loader must match model2vec bit for bit.
      # Only THIS job has model2vec (py3.14) and the cached model; the `test` legs
      # (3.12/3.13, fastembed) skip tests/test_static_direct.py whole. A skip here
      # would mean the pin checks nothing, so it fails the step instead.
      - name: static_direct equality vs model2vec (#1096)
        working-directory: techne
        run: |
          set -euo pipefail
          .venv-ci/bin/python -m pytest tests/test_static_direct.py -q -rs | tee "$RUNNER_TEMP/static-direct.log"
          if grep -q SKIPPED "$RUNNER_TEMP/static-direct.log"; then
            echo "::error::tests/test_static_direct.py skipped a test on the model2vec leg"; exit 1
          fi

      - name: eval_vec gate (#399/#401 — vector/hybrid retrieval + ablation)
        working-directory: techne
        env:
          TECHNE_EVAL_METRICS_OUT: ${{ runner.temp }}/eval-head.json
        run: |
          set -euo pipefail
          # Symmetry with the diff step's rm (#833 r2 nit 3): the `test -s` there
          # is the one check a leftover dump would defeat, and it is the check
          # whose message reads "did it skip?".
          rm -f "$TECHNE_EVAL_METRICS_OUT"
          .venv-ci/bin/python -m pytest -m eval_vec -s

      # techne#945/#895 — the scale arms live HERE rather than in a job of their
      # own because they need exactly what this job already installed: sqlite-vec
      # plus the cached model2vec. A separate job would re-do that setup to run
      # ~40s of tests.
      #
      # #895 asked for an explicit home or an explicit reason. This is the home.
      # The runtime objection its title implies ("a scale test probably should not
      # run on every push") does not survive measurement: 38.8s for all five arms
      # at the default n=2,000, against this job's own ~30s eval_vec gate, inside a
      # 20-minute timeout.
      #
      # REPORTING, NOT GATING. Every arm is informational and asserts only its own
      # instrument — that the padding is present, distinct and embedded, and that
      # the two channels really differ. A score cannot fail this step, so it cannot
      # block a merge on cross-machine embedding wobble. What it buys is the delta
      # printed in the log on every push, which is the thing #883 could not see.
      #
      # The real-content arm skips here: it reads ~/.techne/techne.db and the
      # runner has none. That is by design (techne#945) — it borrows the
      # operator's private rows as distractors and is local-only.
      - name: eval_scale arms (#883/#945 — retrieval at production scale)
        working-directory: techne
        run: .venv-ci/bin/python -m pytest -m eval_scale -s

      # (#832) THE ABSOLUTE GATE ABOVE CANNOT SEE A ONE-GOLD REGRESSION. Its
      # paraphrase recall@10 floor is 0.8, and retrieval_gold.yaml sizes it that
      # way on purpose so "a single gold slipping rank 10->11 (r@10 1.0->0.833)
      # still passes" — a tolerance for cross-machine BLAS wobble. A real
      # regression is the same magnitude: a draft of #827's fix took that class
      # 1.0 -> 0.833 by evicting one gold and this job went GREEN. It never
      # reached main — PR #829's own body records the measurement, and its review
      # rounds ablated the draft before merge.
      #
      # So run it AGAINST THE BASE ON THIS RUNNER and diff. Two runs on one
      # machine need NO tolerance: the leg is byte-deterministic (model2vec/potion
      # is numpy-only static, and conftest's `pinned_model2vec` rebuilds the
      # singleton pinned to it) — confirmed across four processes under differing
      # random hash seeds, full per-task JSON byte-identical. Drift is a
      # CROSS-machine phenomenon and cannot appear here.
      #
      # A SEPARATE WORKTREE, NOT AN IN-PLACE SWAP (Prudence, #833 r1 C1/I2/I3).
      # The first version did `git checkout origin/main -- techne/` and restored
      # with `git checkout HEAD -- techne/`. That is not a restore: `git checkout
      # <ref> -- <path>` WRITES the paths in <ref> and never REMOVES paths absent
      # from it. So a PR that deletes or renames a library module had it
      # resurrected by the swap and left behind by the "restore" — staged and on
      # disk — and the default-suite step below then ran against a tree that was
      # neither HEAD nor main, able to go green BECAUSE the deleted module was
      # back. The mirror hole: a module the PR ADDS survives into the base run, so
      # the base silently measures part of the PR and the diff passes vacuously.
      # A worktree makes both directions structurally impossible and removes the
      # restore window entirely — there is nothing to restore.
      #
      # HEAD's `tests/` is copied over the base worktree's so the HARNESS IS
      # CONSTANT across both runs. NOT ONLY `techne/` DIFFERS (#833 r2 nit 2):
      # the base worktree supplies everything outside `tests/`, `pyproject.toml`
      # included — so `[tool.pytest.ini_options]`, addopts, testpaths and the
      # marker registry come from BASE. That is wording rather than behaviour
      # today (the residual asymmetry fails loudly, and the repo has no root
      # conftest.py), but a maintainer editing addopts should know the two legs
      # would then read different pytest config. NOTE the asymmetry warns rather
      # than fails: `[tool.pytest.ini_options]` sets neither `--strict-markers`
      # nor `filterwarnings = error`, so a base pyproject.toml missing a marker
      # HEAD added does not error. Selection is unaffected — the CLI's
      # `-m eval_vec` overrides addopts' `-m` in both legs (#833 r3).
      #
      # `cd` into the worktree is what makes its `techne/` win over the editable
      # install: `python -m` puts cwd at sys.path[0]. WHAT ENTITLES IT TO WIN is
      # that hatchling writes a BARE-PATH `_editable_impl_techne.pth` — an
      # ordinary sys.path entry that cwd beats. IF THE WHEEL EVER SETS
      # `dev-mode-exact`, that becomes a sys.meta_path finder which wins
      # regardless of cwd, the base leg silently measures HEAD, and this diff
      # goes vacuously green — the exact failure it exists to abolish,
      # reintroduced by a build-config change nobody would connect to CI. Do not
      # set it without replacing the cwd mechanism here.
      #
      # PRs ONLY — on a push the checked-out ref IS main, so base == head.
      #
      # WHY origin/main AND NOT THE MERGE BASE: this job fetches --depth=1 (see
      # the fetch step above), so the histories are disjoint and `git merge-base`
      # finds nothing. Comparing against main's tip is the right question anyway —
      # it is what merging will produce.
      #
      # KNOWN LIMIT, and it is the price of the constant harness: this diffs
      # LIBRARY changes only. A PR that edits `tests/eval/` — the gold set, the
      # scoring — moves both runs together and is invisible here. That needs a
      # human; see compare_retrieval_metrics.py's `_regressions` docstring.
      # `!cancelled()` because a bare `if:` still ANDs the implicit success(), so a
      # HEAD run that trips its own kill-gate would SKIP the comparison — the
      # mirror of the emit-before-gates fix, and the case where "did main already
      # fail this, or did I break it?" is most expensive to answer by hand. The
      # head dump was written either way; this is what lets it be used. An
      # unrelated earlier failure now reaches the step and trips the
      # `test -s "$HEAD_METRICS"` guard, whose "(did it skip?)" wording already
      # covers it. (#833 r3 suggestion.)
      - name: Retrieval diff vs origin/main (#832)
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        working-directory: techne
        env:
          BASE_METRICS: ${{ runner.temp }}/eval-base.json
          HEAD_METRICS: ${{ runner.temp }}/eval-head.json
          BASE_WT: ${{ runner.temp }}/base-worktree
          # A variable only so the script below can be run as-is against another
          # base when demonstrating it locally (#1086). CI always diffs origin/main.
          BASE_REF: origin/main
        run: |
          set -euo pipefail
          # Never inherit either leftover from an earlier job on this runner.
          # These two lines are written under the SAME premise and must agree
          # (#833 r2 I1): if runner.temp survives between jobs, both do real
          # work; if it is wiped, both are free insurance.
          rm -f "$BASE_METRICS"
          # `git worktree add --force` overrides "registered but MISSING". It does
          # NOT override "the path already EXISTS" — that is a fatal (exit 128,
          # reproduced with a POPULATED leftover; an EMPTY one is accepted), and
          # under `set -e` it wedges this step for every subsequent PR until
          # someone cleans the runner by hand.
          #
          # REACHABLE, but narrower than an earlier version of this comment said
          # (#833 r3 nit 3): `git worktree remove` below is NOT the last statement
          # of the happy path — the base-metrics check, the error block and the
          # comparer all follow it. So a failure in the DIFF leaks nothing; only a
          # cancellation, or the 20-minute timeout, landing at or before the base
          # pytest leaks the directory and the registration together. Removing the
          # directory heals both halves, and unlike a `trap` it also heals a runner
          # that is ALREADY poisoned.
          #
          # WHY THIS `rm -rf` IS SAFE, stated correctly (#833 r3 nit 1): NOT
          # because an unset var degrades to `rm -rf ""`. It cannot — the literal
          # `/base-worktree` suffix is part of the expression, so an empty
          # runner.temp would yield `rm -rf "/base-worktree"`, a different string.
          # What actually protects it is `set -u` on line 1: an UNDEFINED BASE_WT
          # aborts the step at expansion, before `rm` runs at all. The step-level
          # `env:` always defines it, so no path reaches here unset.
          rm -rf "$BASE_WT"
          test -s "$HEAD_METRICS" || {
            echo "::error::the eval_vec step produced no head metrics (did it skip?)"
            exit 1; }

          git worktree add --detach --force "$BASE_WT" "$BASE_REF"
          # Constant harness: BASE's library, HEAD's tests.
          rm -rf "$BASE_WT/tests"
          cp -R tests "$BASE_WT/tests"

          # `|| echo ::warning` is the ONE intended tolerance: a base that fails its own
          # kill-gates still emits (the gate writes metrics BEFORE asserting), and
          # its numbers are exactly what we want in that case.
          # --continue-on-collection-errors IS LOAD-BEARING (#857). The line above
          # gives the base leg HEAD's tests against MAIN's library, so a PR that
          # adds a module and its test module together makes that test file
          # unimportable here. Collection happens BEFORE marker selection, so the
          # file kills the whole leg even though `-m eval_vec` would have
          # deselected every test in it — no metrics, no diff, red job, on the
          # ordinary shape of a feature PR. The flag collects what it can.
          #
          # It is safe ONLY because compare_retrieval_metrics.py now refuses to
          # diff legs that measured different case counts (#857). Without that
          # guard this flag would convert a loud collection failure into a
          # quiet comparison over unequal case sets, which is techne#832's own
          # defect in a new hat. Do not keep one without the other.
          #
          # TECHNE_EVAL_BASE_LEG (#1086): a PR that adds a search() kwarg and a gold
          # task that sets it would make MAIN's search() raise TypeError at call
          # time, which no collection flag can catch, and the leg would write no
          # metrics. With this set, the harness skips such a task (checked with
          # inspect.signature), lists it under `skipped_no_base`, and the comparer
          # names it "new in HEAD, no base" and diffs the rest. Only this leg sets
          # it; on any other run an unsupported kwarg fails the gate.
          ( cd "$BASE_WT" \
            && TECHNE_EVAL_BASE_LEG=1 \
               TECHNE_EVAL_METRICS_OUT="$BASE_METRICS" \
               "$GITHUB_WORKSPACE/techne/.venv-ci/bin/python" -m pytest -m eval_vec -q \
                  --continue-on-collection-errors ) \
            || echo "::warning::base run did not pass its own kill-gates; diffing anyway"

          git worktree remove --force "$BASE_WT"

          # ONE annotation, not four. The runner parses stdout line by line and
          # every `::error::` line is an independent workflow command, so the
          # multi-line form fragments into sentence pieces in the Checks UI, read
          # out of order and out of context. `%0A` carries real newlines inside a
          # single annotation (#833 r3 nit 2). These are the only annotations in
          # this repo's workflows, so this sets the convention.
          test -s "$BASE_METRICS" || {
            echo "::error::no base metrics produced — cannot diff.%0AMost likely the base leg failed to COLLECT: HEAD's tests/ importing a library symbol that origin/main does not have.%0ACheck the base pytest output above for ImportError/AttributeError."
            exit 1; }
          .venv-ci/bin/python scripts/compare_retrieval_metrics.py \
            "$BASE_METRICS" "$HEAD_METRICS"

      # This is the ONLY job with model2vec: `[vectors]` gates it to py>=3.14
      # (pyproject.toml:45) and the matrix is 3.12/3.13, which get fastembed. So
      # without this step the model2vec branch of EmbeddingModel.embed() runs
      # nowhere — and #536 is a bug in the other branch of that same function
      # (#537). Runs the DEFAULT suite, not a list of vector files: a hand-kept
      # list would drift the first time someone adds a vector-touching test.
      - name: Default suite on the model2vec backend (#537)
        working-directory: techne
        run: .venv-ci/bin/python -m pytest -q -rs -n 4

  # (#383) Architecture-card freshness. Each card in ARCHITECTURE.md / docs/arch/*.md
  # pins the git blob sha of the seam file(s) it describes; this recomputes them and
  # fails when code drifted from its card — turning "detected staleness" into
  # visible-at-PR staleness. NOTE it cannot BLOCK: branch protection is unavailable
  # on this repo's plan (`gh api .../branches/main/protection` → 403), so no check
  # here is required. Red means "stop" by convention, not by enforcement.
  #
  # Same reasoning as the eval gates above: a regression gate that nothing invokes
  # protects nothing (Prudence, #397). This one was written 2026-07-20 and went
  # unwired until 2026-08-02, by which point 2 of 8 cards had silently drifted —
  # including a card carrying a GOTCHA that its own seam had since fixed.
  #
  # Its own unit tests (tests/test_arch_cards_gate.py) run in the matrix job, and as
  # of #706 (test_real_repo_cards_are_fresh) one of those unit tests ALSO runs the
  # gate against the real cards, so this step is no longer the only place that
  # happens — it is CI's copy of the same check, independent of a local pytest run.
  # Stdlib-only and deterministic: no pip install, no extras, ~0.3s.
  arch-cards:
    # Do not move back to ubuntu-latest (#461): hosted jobs here can fail to
    # SCHEDULE and never run, which no rerun clears. Failure mode now: no free
    # runner = ~24h queued, then expiry. timeout-minutes cannot bound either
    # case — it counts from job START (the 901s deaths above ran under the
    # default 360min).
    runs-on: [self-hosted, linux, x64, techne-ci]
    # Fork guard (#556) — see the block above `jobs:`. NOTE this does NOT undo
    # #461's "do not move back to ubuntu-latest": the non-fork path, which is
    # every push and every in-repo PR, still runs here. Only fork PRs are routed
    # away, and for those the scheduling risk #461 describes is the lesser of two
    # evils against arbitrary code execution on the CI host.
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
    timeout-minutes: 5
    steps:
      - name: Checkout techne
        uses: actions/checkout@v4
        with:
          path: techne

      # Keep the versioned name: only python3.12/3.13/3.14 are proven present;
      # a bare `python3` symlink is NOT implied by the image. This step also
      # needs `git` on PATH (rev-parse/hash-object); without it the gate exits 2
      # with "git executable not found", i.e. loud, not green.
      - name: Architecture-card freshness gate
        working-directory: techne
        run: python3.13 scripts/check_arch_cards.py

      # (#834) A stray `git worktree add` with an unset path variable collapsed to
      # its two-arg form and committed a mode-160000 gitlink to a PR branch, caught
      # only by reading `git push` output — this repo has no submodules, so ANY
      # 160000 entry is a mistake by definition. Same posture as the gate above:
      # reports, does not block (no branch protection on this plan).
      - name: Stray gitlink guard
        working-directory: techne
        run: |
          set -uo pipefail
          gitlinks=$(git ls-files -s | grep '^160000' || true)
          if [ -n "$gitlinks" ]; then
            echo "::error::stray gitlink(s) (mode 160000) committed — a worktree was likely added with a missing/misused path argument (techne#834)"
            echo "$gitlinks"
            exit 1
          fi

  # CRASH-RECOVERY GATE (#388). The `crash` suite SIGKILLs a child mid-write and
  # then proves the store: uncommitted work leaves no trace, committed work
  # survives, a hot WAL replays, an interrupted migration does not stamp its
  # version, and an interrupted flush never marks a row delivered.
  #
  # IT IS EXCLUDED FROM THE DEFAULT RUN, SO THIS JOB IS WHAT MAKES IT REAL.
  # ARCHITECTURE.md draws exactly this line: exclusion alone does not tell you
  # whether a suite is covered by a dedicated job or covered by nothing, and the
  # second decays silently. `-p no:randomly` because these spawn subprocesses and
  # assert on a shared on-disk store; order independence is not a property worth
  # buying here, and a random order that flakes would teach people to re-run CI.
  crash-recovery:
    runs-on: [self-hosted, linux, x64, techne-ci]
    # Fork guard (#556) — same rationale as every self-hosted job above.
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
    timeout-minutes: 10
    steps:
      - name: Checkout techne
        uses: actions/checkout@v4
        with:
          path: techne

      - name: Create venv on Python 3.13
        working-directory: techne
        run: python3.13 -m venv .venv-ci

      - name: Install
        working-directory: techne
        run: |
          .venv-ci/bin/python -m pip install -q --upgrade pip
          .venv-ci/bin/python -m pip install -q -e ".[codex]" pytest

      # -m crash OVERRIDES the addopts exclusion; without this flag the job would
      # report green having selected zero tests, which is the failure mode the
      # comment above exists to prevent.
      - name: Crash-recovery fault injection (#388)
        working-directory: techne
        run: .venv-ci/bin/python -m pytest -m crash -q -rs -p no:randomly

  # (#1059) PROVE THE ARTIFACT, NOT THE CHECKOUT. Every job above installs techne
  # EDITABLE (`uv pip install -e ...`), so pytest always runs with the checkout
  # importable. A packaging defect can't show up there: a module or package-data
  # file missing from the wheel, a wrong `[project.scripts]` target, or a broken
  # `techne.sync_adapters` entry point, because the source tree always satisfies
  # the import regardless of what the wheel actually contains. v0.16.0 already
  # reached external partners with exactly this class of defect (knowledge #2836:
  # a hook template segment missing from the wheel, fixed in 0.16.1).
  #
  # scripts/acceptance.sh does the rest: builds the wheel with `uv build`,
  # installs it into a FRESH venv twice (core, then `[recommended]` — the extra
  # the README's blessed pipx install line uses), `cd`s into a fresh temp dir so
  # the checkout can never shadow the installed package on `sys.path`, and then
  # runs `techne --version` against pyproject's version, every entry point the
  # `techne` distribution declares (tests/test_entry_points.py, which also runs
  # standalone with no pytest), two bundled guides (package data), `init --help`
  # / `doctor --help`, and asserts `techne.__file__` resolves under the venv's
  # site-packages rather than the checkout. Same script docs/releasing.md's SOP
  # calls before tagging — this job does not replace that step (which checks the
  # PUBLISHED tag); it moves the packaging-defect signal from "after tagging" to
  # "on the PR".
  #
  # HOSTED, DELIBERATELY (#461/#556): a hosted runner is fine here because the
  # job's only inputs are `uv`, a stock interpreter and the PR's own
  # pyproject.toml — none of the self-hosted image's baked interpreters or uv
  # install are needed, so there is no reason to spend the small pool's
  # capacity on it.
  #
  # STILL CARRIES THE SAME `if:` AS THE SELF-HOSTED JOBS ABOVE, though — this is
  # `TRUSTED_POOL`'s trigger scope (push / workflow_dispatch / non-fork PR)
  # borrowed for what it actually says, not for the self-hosted trust boundary
  # #556 coined it for. `tests/test_ci_workflow_triggers.py::
  # test_the_two_guards_are_complements_not_overlaps` requires every job to
  # carry one of the two exact expressions, so a job that is neither
  # self-hosted nor fork-only still has to pick one — and this one is not
  # fork-only, so it takes the other. THE PRICE: a fork PR does not get this
  # job, same trade `eval-vec`/`arch-cards` already made and `fork-pr`'s
  # trailing comment already lists — see the third bullet added there.
  acceptance:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
    timeout-minutes: 15
    steps:
      - name: Checkout techne
        uses: actions/checkout@v4
        with:
          path: techne

      # A hosted runner bakes in neither uv nor a pinned interpreter — provided
      # here, same as `fork-pr` below. setup-python puts the interpreter on PATH
      # as a SYSTEM one, so the workflow-level UV_PYTHON_PREFERENCE=only-system /
      # UV_PYTHON_DOWNLOADS=never pin (see env: above `jobs:`) still applies.
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Installed-artifact acceptance (core + recommended)
        working-directory: techne
        run: bash scripts/acceptance.sh

  # THE OTHER HALF OF THE TRUST SPLIT (#556). Fork PRs are skipped by every
  # self-hosted job above, so without this they would get an EMPTY Checks tab —
  # which is the exact failure #530 fought: nothing in CI can report a run that
  # never started, and an empty tab reads as "nothing to report" rather than
  # "unverified". A security fix that silently stops testing outside contributions
  # trades one invisible failure for another.
  #
  # Runs on GitHub-hosted, so fork code never touches the self-hosted pool.
  fork-pr:
    if: ${{ !(github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
      fail-fast: false

    steps:
      - name: Checkout techne
        uses: actions/checkout@v4
        with:
          path: techne

      # MAKE `origin/main` RESOLVE, because a shipped check reads it (techne#690).
      # `doctor`'s `runtime:revision` runs `git rev-parse --short origin/main` and
      # returns UNKNOWN when it fails (checks.py), which fails four test_cli_doctor
      # tests and the whole job. On a PUSH the checked-out ref IS main, so it
      # resolves; on a PULL_REQUEST actions/checkout fetches only the merge ref at
      # depth 1 and `origin/main` does not exist locally.
      #
      # THIS PASSED FOR MONTHS ON LEFTOVER STATE, which is the part worth recording.
      # `actions/checkout` fetches into an EXISTING repo dir rather than re-cloning,
      # and the self-hosted runner container had been up for days with a `_work`
      # clone that had accumulated `origin/main` from earlier main-branch runs. Every
      # PR silently inherited that ref. Recreating the container on 2026-08-26 wiped
      # `_work`, and every PR run failed from that moment while `main` stayed green —
      # a clean before/after at 13:20Z across four branches.
      #
      # One ref, depth 1: enough for the comparison, and not a full-history clone.
      # KNOWN COST of --depth=1 (Prudence, #779 Nit 3): the two histories are then
      # disjoint, `git merge-base` finds nothing, and `rev-list --left-right --count`
      # returns 1 1. So the CI log's "N commit(s) behind origin/main" (checks.py) is
      # an artifact, not a distance. The VERDICT is unaffected -- DORMANT is reached
      # via the branch gate, not the count -- but do not read that number off a CI log.
      - name: Fetch origin/main for runtime:revision
        working-directory: techne
        run: git fetch --depth=1 origin +refs/heads/main:refs/remotes/origin/main

      # The self-hosted image bakes in both uv and the interpreters; a hosted
      # runner has neither at the matrix versions, so they are provided here.
      # setup-python puts the interpreter on PATH as a SYSTEM interpreter, which
      # is what keeps the workflow-level `UV_PYTHON_PREFERENCE: only-system` +
      # `UV_PYTHON_DOWNLOADS: never` pin meaningful rather than merely inert: uv
      # still may not fetch a managed build of its own, so the leg cannot quietly
      # test an interpreter nobody chose.
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Create venv on Python ${{ matrix.python-version }}
        working-directory: techne
        run: |
          uv venv --python ${{ matrix.python-version }} .venv-ci
          .venv-ci/bin/python -V

      - name: Install
        working-directory: techne
        # NO `vectors` EXTRA, DELIBERATELY (#570 review). Installing it makes the
        # vector-backed tests RUN in the suite below, and this job has no cache step
        # and no pre-fetch — the exact configuration recorded near the top of this
        # file as the #535 red build: an un-cached model re-downloaded by every job on
        # every matrix entry.
        #
        # AND ADDING A CACHE IS THE WRONG FIX HERE ANYWAY, for a reason that does not
        # depend on how GitHub scopes fork caches: this job runs ATTACKER-CONTROLLED
        # CODE on GitHub's hosted account. Pulling a model down on both matrix legs to
        # serve that is spending bandwidth and cache space on an untrusted contributor
        # — the wrong place to add a resource, whatever the cache semantics turn out
        # to be. (An earlier revision justified this by asserting GitHub isolates cache
        # WRITES from fork PRs so a cache could never populate. That may well be true,
        # but it was a HAND TRACE I did not verify, and the review flagged that reads
        # are likely NOT isolated — a restore-only step would probably hit main's key.
        # The argument above does not rest on either reading.)
        #
        # This also makes the install match what this job's own footer already
        # claims: fork PRs get the suite and the deterministic gates, NOT the vector
        # gate. Before this the footer said one thing and the extra did another —
        # the vector tests ran here, cold. With `-rs` below they report as SKIPPED,
        # which is visible rather than silent.
        run: uv pip install --python .venv-ci/bin/python -e ".[dev,codex]"

      # Same flags as the self-hosted leg, and for the same reasons: `-rs` so a
      # skip is reported rather than counted, `-n 4` to match what was measured.
      - name: Pytest (includes contract assertions)
        working-directory: techne
        run: .venv-ci/bin/python -m pytest -q -rs -n 4

      - name: Deterministic eval gates (#68 recall, #385 retrieval-correctness)
        working-directory: techne
        run: .venv-ci/bin/python -m pytest -m "eval or eval_gate"

      # NOT REPRODUCED HERE, deliberately, and this list is the honest cost of the
      # split rather than an oversight:
      #   - eval-vec  — needs Python 3.14 plus a warm model2vec cache. Hosted
      #                 images ship neither, and `UV_PYTHON_DOWNLOADS: never`
      #                 (correctly) forbids fetching one.
      #   - arch-cards — invokes `python3.13` by versioned name against a runner
      #                 image proven to carry it; that is a property of the
      #                 self-hosted image, not of ubuntu-latest.
      #   - acceptance (#1059) — not a runner-image limit like the two above;
      #                 it took `TRUSTED_POOL`'s trigger scope only because
      #                 every job must pick one of the two exact guards
      #                 (test_the_two_guards_are_complements_not_overlaps), and
      #                 it is not fork-only. Could be reproduced here — it is
      #                 hosted already — but doubling wheel-build-and-install
      #                 into a job whose own working code is not what packaging
      #                 correctness is about did not seem worth the runtime.
      # A fork PR therefore gets the full suite and the deterministic gates, but
      # NOT the vector gate, the card-freshness gate, or the installed-artifact
      # smoke test. All three still run on every push to main, so nothing merges
      # unverified — a fork PR is simply verified less completely than an
      # in-repo one, which is the trade the trust boundary buys. Widening it
      # means re-platforming those gates: worth its own issue,
      # not worth blocking a security fix behind.
