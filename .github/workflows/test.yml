name: test

# Techne has no private sibling deps — full suite runs on every push/PR.
#
# EVERY JOB RUNS ON A GITHUB-HOSTED RUNNER (`ubuntu-latest`), and none carries an
# `if:` that skips fork PRs. The repo is public, or about to be, and the rule is:
# a public repo runs CI on GitHub-hosted runners only, no runner of ours is
# reachable from it, and a pull request from a fork runs the real tests. A fork
# PR gets the same jobs and the same matrix as an in-repo PR.
# tests/test_ci_workflow_triggers.py pins all three (no runner of ours in any
# workflow's `runs-on`, no fork-excluding `if:`, a `ci` job that gates on the rest).
#
# THE `ci` JOB AT THE BOTTOM IS THE ONE A RULESET REQUIRES. It `needs:` every other
# job and fails unless each result is `success`, so a skipped, failed or cancelled
# job all read as red. Without it a required check on `test` alone would let a
# skipped `eval-vec` look like a pass. Add a job here and the same test makes you
# add it to `ci`'s `needs:`.
#
# Hosted runners are a fresh VM per job. That is why every job installs its own
# interpreter (actions/setup-python) and uv, and why the two model caches below
# (actions/cache) matter: a cold model download is every job's problem, not a rare
# one. See docs/go-public-runbook.md for the flip sequence.
#
# NO `branches:` FILTER ON pull_request, AND THAT ABSENCE IS LOAD-BEARING (#530).
# The filter matches a PR's BASE, not its head, so `branches: [main]` meant a
# STACKED PR (base = another feature branch) matched no trigger and got NO CI AT
# ALL — not the test matrix, not eval-vec, not arch-cards, since all three jobs
# live in this one file. Measured on #526: zero runs ever created, while every
# base=main PR open at the same moment ran normally.
#
# WHAT MAKES IT DANGEROUS RATHER THAN MERELY MISSING: there is no red X and no
# skipped row. The Checks tab is EMPTY, which reads identically to "nothing to
# report" (techne#488's shape, in our own CI config). And a required check cannot
# backstop it: a run that never started reports nothing for the ruleset to wait
# on, so this trigger is the ONLY mechanism.
#
# STACKING IS FORCED BY OUR OWN CONVENTIONS, so this is not an edge case: two PRs
# touching one card-anchored source file must both bump the same `anchor:` sha in
# docs/arch/liveness.md, and two migrations must both edit SCHEMA_VERSION — both
# guaranteed conflicts that stacking is the normal answer to.
#
# REJECTED: adding `fix/*`/`feat/*` to the base filter — a hand-maintained list of
# branch names is a copy of a convention nothing enforces, and it fails silently
# the first time someone picks a name outside it. That is the trap that produced
# this issue. Also rejected: documenting "stacked PRs need workflow_dispatch" — a
# discipline, not a mechanism, failing the same way, by requiring someone to notice.
#
# COST, measured before removing it (2026-08-08): a base=main PR gets exactly ONE
# pull_request run per sha, and `push` fires only on main, so dropping the filter
# adds runs ONLY for stacked PRs — which today get zero. It doubles nothing.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Make uv use the interpreter actions/setup-python put on PATH and never fetch a
# managed build of its own. Without this the matrix claims to test 3.12/3.13/3.14
# while potentially exercising whatever uv decided to download, and `python -V`
# cannot tell the two apart — it prints the same string either way.
# setup-python installs its interpreter as a SYSTEM one, so `only-system` finds it.
#
# This has teeth on the eval-vec leg specifically. sqlite-vec is a loadable SQLite
# extension, and search.py degrades GRACEFULLY when the interpreter lacks
# loadable-extension support: search_vec returns [] and backfill_vectors returns {}
# (the guarded except at search.py:590/868, from #84). So an interpreter without
# that support does not crash the gate — it makes the gate quietly measure an
# FTS-only path while still reporting green. A silent wrong-interpreter is exactly
# the failure this pin prevents.
env:
  UV_PYTHON_PREFERENCE: only-system
  UV_PYTHON_DOWNLOADS: never

jobs:
  test:
    runs-on: ubuntu-latest
    # Bound it: a hung job burns billed minutes. Legs are ~6-12min.
    timeout-minutes: 45
    strategy:
      matrix:
        # 3.12 ONLY ON PULL REQUESTS; the full 3.12/3.13 matrix on main pushes and
        # workflow_dispatch (issue 1233). Billed minutes are the constraint while
        # the repo is private: every PR push would otherwise run the full suite
        # twice. The cost: a break that only shows on 3.13 is caught on main after
        # merge, not on the PR. To run 3.13 for a PR branch on demand:
        # `gh workflow run test.yml --ref <branch>`. Fork PRs get the same matrix.
        python-version: ${{ fromJSON(github.event_name == 'pull_request' && '["3.12"]' || '["3.12", "3.13"]') }}
      fail-fast: false

    steps:
      - name: Checkout techne
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: techne

      # MAKE `origin/main` RESOLVE, because a shipped check reads it (techne#690).
      # `doctor`'s `runtime:revision` runs `git rev-parse --short origin/main` and
      # returns UNKNOWN when it fails (checks.py), which fails four test_cli_doctor
      # tests and the whole job. On a PUSH the checked-out ref IS main, so it
      # resolves; on a PULL_REQUEST actions/checkout fetches only the merge ref at
      # depth 1 and `origin/main` does not exist locally. A hosted runner starts
      # from an empty workspace every time, so this fetch is always needed.
      #
      # One ref, depth 1: enough for the comparison, and not a full-history clone.
      # KNOWN COST of --depth=1 (Prudence, #779 Nit 3): the two histories are then
      # disjoint, `git merge-base` finds nothing, and `rev-list --left-right --count`
      # returns 1 1. So the CI log's "N commit(s) behind origin/main" (checks.py) is
      # an artifact, not a distance. The VERDICT is unaffected -- DORMANT is reached
      # via the branch gate, not the count -- but do not read that number off a CI log.
      - name: Fetch origin/main for runtime:revision
        working-directory: techne
        run: git fetch --depth=1 origin +refs/heads/main:refs/remotes/origin/main

      # A hosted runner bakes in neither uv nor every matrix interpreter, so both
      # are installed here. `uv venv --python` then selects the matrix version
      # explicitly, and every step below runs through the venv rather than relying
      # on PATH.
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Create venv on Python ${{ matrix.python-version }}
        working-directory: techne
        run: |
          uv venv --python ${{ matrix.python-version }} .venv-ci
          .venv-ci/bin/python -V

      - name: Install
        working-directory: techne
        # codex extra brings the tree-sitter grammars so the codex extraction tests
        # run (not skip) in CI.
        #
        # `vectors` added for #535: WITHOUT IT, VECTOR TESTS RAN IN NEITHER LEG.
        # This leg runs everything but had no vector backend, so they SKIPPED;
        # eval-vec has the backend but runs `-m eval_vec` only, so they were never
        # SELECTED. Six files fell through the gap — test_inference, test_search,
        # test_embeddings, test_cli_vectors, test_checks, test_documents — none of
        # which carry the eval_vec marker. Measured, not estimated.
        run: uv pip install --python .venv-ci/bin/python -e ".[dev,codex,vectors]"


      # THE EXTRA ALONE IS NOT THE FIX, and shipping it alone would have been
      # #535 again in a new costume: `backend_available()` only tests
      # IMPORTABILITY, so the extra un-skips the tests — but the ones that matter
      # then EMBED FOR REAL (test_cli_vectors.py:56 says so in as many words:
      # "exercises the real backfill_vectors() path, not a mock"), and an
      # un-cached model means a fresh download on every job and matrix entry: a
      # hosted runner is a new VM each time, so only actions/cache carries it over.
      # model2vec 0.8.2 defaults force_download=True (embeddings.py:271), so
      # without force_download=False a restored cache is dead weight — that is
      # Prudence's #403 finding, reused here rather than rediscovered.
      #
      # THE BACKEND HERE IS NOT model2vec, AND ASSUMING IT WAS COST A RED BUILD.
      # `[vectors]` is SPLIT AT THE 3.14 BOUNDARY (techne#601, pyproject.toml:38/45):
      #   python <  3.14  -> fastembed   (onnxruntime has no 3.14 wheel)
      #   python >= 3.14  -> model2vec
      # This matrix is 3.12/3.13, so it gets FASTEMBED. eval-vec pins 3.14, which
      # is why the identical model2vec pre-fetch works there and blew up here with
      # ModuleNotFoundError on the first run of this change.
      #
      # So the pre-fetch has to match the backend the resolver actually chose for
      # this interpreter, not the one the other job uses. Model name from
      # embeddings.py:72 (_DEFAULT_FASTEMBED_MODEL) rather than retyped — a second
      # copy of that string would drift the first time the default changes.
      - name: Cache the fastembed model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          # fastembed caches ONNX weights here, not in ~/.cache/huggingface.
          # Deliberately a DIFFERENT key from eval-vec's: different backend,
          # different artifact. Sharing one key would let a 3.14 model2vec cache
          # satisfy a 3.12 fastembed restore and leave the real download to run.
          path: ~/.cache/fastembed
          key: fastembed-${{ matrix.python-version }}-all-MiniLM-L6-v2

      - name: Pre-fetch the embedding model
        working-directory: techne
        # CALLS THE PRODUCTION ENTRY POINT, and that is the whole fix. An earlier
        # version constructed `TextEmbedding(model_name=...)` itself, deriving the
        # model name from the module but NOT the cache directory — and
        # `_build_backend` (embeddings.py:231-237) constructs, mkdirs and passes
        # `cache_dir=~/.cache/fastembed` explicitly. So the pre-fetch warmed
        # fastembed's default location while the tests read a different one: the
        # step ran, passed, and bought a second full download per job.
        #
        # IT ALSO PRODUCED A FALSE EXPLANATION. The four failures on #535's first
        # green run were blamed on "the model not being pre-fetched"; the workflow
        # was in fact BYTE-IDENTICAL between that run and the passing one (`git
        # diff 0f5f4a2 e00e4c5` touches tests/ only). The only difference was
        # actions/cache going MISS -> HIT, populated at post-job BY THE TESTS.
        # Which means the suite was passing on a warm cache and would have gone
        # red on the first cold one — a python bump, a model rename, or 7-day
        # eviction — landing on an unrelated PR wearing a JSONDecodeError.
        #
        # `_get_embedding_model()` cannot drift from the code under test: same
        # backend selection (so this is correct on BOTH sides of the 3.14
        # fastembed/model2vec split), same model, same cache_dir, by construction.
        # allow_download defaults True, which is what a pre-fetch wants.
        run: .venv-ci/bin/python -c "from techne.core.embeddings import _get_embedding_model; m = _get_embedding_model(); print('prefetched', m.name)"

      - name: Ruff lint
        working-directory: techne
        run: .venv-ci/bin/python -m ruff check techne tests || true  # advisory until strict pass is done

      # Parallel test execution (#463). The suite is syscall-heavy (per-test
      # filesystem setup dominates) and kernel CPU time in getdents/mkdir/stat is
      # CPU work: it COMPETES for cores rather than overlapping, so the speedup
      # ceiling is the core count, not I/O wait.
      #
      # WORKER COUNT IS PINNED, not `auto`, for the same reason this workflow
      # pins UV_PYTHON_PREFERENCE above: CI must not silently run something
      # other than what it claims. `auto` resolves from the host at runtime and
      # moves without anyone editing this file. 4 was measured on the retired
      # runner this workflow used before and has NOT been re-measured on hosted runners; change
      # it deliberately once a hosted run shows a better number.
      #
      # NOT applied to the eval gates below or to eval-vec: both select exactly
      # 2 tests (verified via --collect-only), where worker startup costs more
      # than it saves, and eval-vec additionally runs with `-s`, which xdist
      # does not support.
      - name: Pytest (includes contract assertions)
        working-directory: techne
        # `-rs` PRINTS THE SKIP REASONS. Without it this leg reports a bare
        # "N skipped" and nobody can say WHICH — the exact condition that let
        # #535 hide six files of vector tests for months. A count is not a
        # report: an unexplained skip reads as "nothing to see" in precisely the
        # way techne#488 is about. Local runs skip 18 and CI skipped 5, and until
        # this flag existed there was no way to know whether those five were the
        # harmless ones.
        run: .venv-ci/bin/python -m pytest -q -rs -n 4

      # (#398) Deterministic eval gates — FTS-only, no vector/LLM deps, ~0.5s.
      # A regression gate that nothing invokes protects nothing (Prudence, #397).
      # CLI -m overrides the addopts exclusion. eval_llm stays out (needs a key).
      - name: Deterministic eval gates (#68 recall, #385 retrieval-correctness)
        working-directory: techne
        run: .venv-ci/bin/python -m pytest -m "eval or eval_gate"


  # (#398) Vector/hybrid retrieval gate (#399/#401) on its own leg: it pins
  # model2vec, which the [vectors] extra installs only on py>=3.14, so it can't
  # run on the 3.12/3.13 matrix above. Kept separate so the deterministic gates
  # stay fast and dep-free.
  eval-vec:
    runs-on: ubuntu-latest
    # Observed at ~30s of gate time; 20 bounds a hang without being tight.
    timeout-minutes: 20
    steps:
      - name: Checkout techne
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: techne

      # MAKE `origin/main` RESOLVE, because a shipped check reads it (techne#690).
      # `doctor`'s `runtime:revision` runs `git rev-parse --short origin/main` and
      # returns UNKNOWN when it fails (checks.py), which fails four test_cli_doctor
      # tests and the whole job. On a PULL_REQUEST actions/checkout fetches only the
      # merge ref at depth 1, so `origin/main` does not exist locally. The
      # `--depth=1` caveat (the commits-behind count is an artifact) is spelled out
      # at the same step in the `test` job.
      - name: Fetch origin/main for runtime:revision
        working-directory: techne
        run: git fetch --depth=1 origin +refs/heads/main:refs/remotes/origin/main

      # eval-vec needs Python 3.14: the [vectors] extra resolves to model2vec only
      # on py>=3.14 (pyproject.toml:45), and model2vec is what the gate pins.
      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.14'

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Create venv on Python 3.14
        working-directory: techne
        run: |
          uv venv --python 3.14 .venv-ci
          .venv-ci/bin/python -V

      - name: Install (with vectors)
        working-directory: techne
        run: uv pip install --python .venv-ci/bin/python -e ".[dev,codex,vectors]"

      - name: Cache the pinned model2vec model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/huggingface
          key: hf-model2vec-potion-base-8M

      - name: Pre-fetch potion-base-8M into the HF cache
        # The eval_vec fixture SKIPS unless the pinned model is already cached
        # (it probes with allow_download=False). Fetch it up front so the gate
        # actually RUNS in CI instead of silently skipping.
        # force_download=False so a restored cache is actually reused (model2vec
        # 0.8.2 defaults it to True — see embeddings.py:271); otherwise the
        # actions/cache step above would be dead weight. (#403 review — Prudence.)
        #
        # A hosted runner is a fresh VM per job, so the cache is cold unless
        # actions/cache restores it: GitHub's 7-day and 10 GB limits apply to the
        # remote entry, and a miss costs one model download.
        working-directory: techne
        run: .venv-ci/bin/python -c "from model2vec import StaticModel; StaticModel.from_pretrained('minishlab/potion-base-8M', force_download=False)"

      # techne#1096 — the direct potion loader must match model2vec bit for bit.
      # Only THIS job has model2vec (py3.14) and the cached model; the `test` legs
      # (3.12/3.13, fastembed) skip tests/test_static_direct.py whole. A skip here
      # would mean the pin checks nothing, so it fails the step instead.
      - name: static_direct equality vs model2vec (#1096)
        working-directory: techne
        run: |
          set -euo pipefail
          .venv-ci/bin/python -m pytest tests/test_static_direct.py -q -rs | tee "$RUNNER_TEMP/static-direct.log"
          if grep -q SKIPPED "$RUNNER_TEMP/static-direct.log"; then
            echo "::error::tests/test_static_direct.py skipped a test on the model2vec leg"; exit 1
          fi

      # Issue 1217 — the numpy-free query embed must match the numpy path byte for
      # byte, on THIS job's numpy build and CPU, at the real 256-dim table. Same
      # reason as above: only this job has the cached model, so a skip fails the step.
      - name: query_embed byte equality vs the numpy path (#1217)
        working-directory: techne
        run: |
          set -euo pipefail
          .venv-ci/bin/python -m pytest tests/test_query_embed.py -q -rs | tee "$RUNNER_TEMP/query-embed.log"
          if grep -q SKIPPED "$RUNNER_TEMP/query-embed.log"; then
            echo "::error::tests/test_query_embed.py skipped a test on the model2vec leg"; exit 1
          fi

      - name: eval_vec gate (#399/#401 — vector/hybrid retrieval + ablation)
        working-directory: techne
        env:
          TECHNE_EVAL_METRICS_OUT: ${{ runner.temp }}/eval-head.json
        run: |
          set -euo pipefail
          # Symmetry with the diff step's rm (#833 r2 nit 3): the `test -s` there
          # is the one check a leftover dump would defeat, and it is the check
          # whose message reads "did it skip?".
          rm -f "$TECHNE_EVAL_METRICS_OUT"
          .venv-ci/bin/python -m pytest -m eval_vec -s

      # techne#945/#895 — the scale arms live HERE rather than in a job of their
      # own because they need exactly what this job already installed: sqlite-vec
      # plus the cached model2vec. A separate job would re-do that setup to run
      # ~40s of tests.
      #
      # #895 asked for an explicit home or an explicit reason. This is the home.
      # The runtime objection its title implies ("a scale test probably should not
      # run on every push") does not survive measurement: 38.8s for all five arms
      # at the default n=2,000, against this job's own ~30s eval_vec gate, inside a
      # 20-minute timeout.
      #
      # REPORTING, NOT GATING. Every arm is informational and asserts only its own
      # instrument — that the padding is present, distinct and embedded, and that
      # the two channels really differ. A score cannot fail this step, so it cannot
      # block a merge on cross-machine embedding wobble. What it buys is the delta
      # printed in the log on every push, which is the thing #883 could not see.
      #
      # The real-content arm skips here: it reads ~/.techne/techne.db and the
      # job's VM has none. That is by design (techne#945) — it borrows the
      # operator's private rows as distractors and is local-only.
      - name: eval_scale arms (#883/#945 — retrieval at production scale)
        working-directory: techne
        run: .venv-ci/bin/python -m pytest -m eval_scale -s

      # (#832) THE ABSOLUTE GATE ABOVE CANNOT SEE A ONE-GOLD REGRESSION. Its
      # paraphrase recall@10 floor is 0.8, and retrieval_gold.yaml sizes it that
      # way on purpose so "a single gold slipping rank 10->11 (r@10 1.0->0.833)
      # still passes" — a tolerance for cross-machine BLAS wobble. A real
      # regression is the same magnitude: a draft of #827's fix took that class
      # 1.0 -> 0.833 by evicting one gold and this job went GREEN. It never
      # reached main — PR #829's own body records the measurement, and its review
      # rounds ablated the draft before merge.
      #
      # So run it AGAINST THE BASE IN THIS JOB and diff. Two runs on one
      # machine need NO tolerance: the leg is byte-deterministic (model2vec/potion
      # is numpy-only static, and conftest's `pinned_model2vec` rebuilds the
      # singleton pinned to it) — confirmed across four processes under differing
      # random hash seeds, full per-task JSON byte-identical. Drift is a
      # CROSS-machine phenomenon and cannot appear here.
      #
      # A SEPARATE WORKTREE, NOT AN IN-PLACE SWAP (Prudence, #833 r1 C1/I2/I3).
      # The first version did `git checkout origin/main -- techne/` and restored
      # with `git checkout HEAD -- techne/`. That is not a restore: `git checkout
      # <ref> -- <path>` WRITES the paths in <ref> and never REMOVES paths absent
      # from it. So a PR that deletes or renames a library module had it
      # resurrected by the swap and left behind by the "restore" — staged and on
      # disk — and the default-suite step below then ran against a tree that was
      # neither HEAD nor main, able to go green BECAUSE the deleted module was
      # back. The mirror hole: a module the PR ADDS survives into the base run, so
      # the base silently measures part of the PR and the diff passes vacuously.
      # A worktree makes both directions structurally impossible and removes the
      # restore window entirely — there is nothing to restore.
      #
      # HEAD's `tests/` is copied over the base worktree's so the HARNESS IS
      # CONSTANT across both runs. NOT ONLY `techne/` DIFFERS (#833 r2 nit 2):
      # the base worktree supplies everything outside `tests/`, `pyproject.toml`
      # included — so `[tool.pytest.ini_options]`, addopts, testpaths and the
      # marker registry come from BASE. That is wording rather than behaviour
      # today (the residual asymmetry fails loudly, and the repo has no root
      # conftest.py), but a maintainer editing addopts should know the two legs
      # would then read different pytest config. NOTE the asymmetry warns rather
      # than fails: `[tool.pytest.ini_options]` sets neither `--strict-markers`
      # nor `filterwarnings = error`, so a base pyproject.toml missing a marker
      # HEAD added does not error. Selection is unaffected — the CLI's
      # `-m eval_vec` overrides addopts' `-m` in both legs (#833 r3).
      #
      # `cd` into the worktree is what makes its `techne/` win over the editable
      # install: `python -m` puts cwd at sys.path[0]. WHAT ENTITLES IT TO WIN is
      # that hatchling writes a BARE-PATH `_editable_impl_techne.pth` — an
      # ordinary sys.path entry that cwd beats. IF THE WHEEL EVER SETS
      # `dev-mode-exact`, that becomes a sys.meta_path finder which wins
      # regardless of cwd, the base leg silently measures HEAD, and this diff
      # goes vacuously green — the exact failure it exists to abolish,
      # reintroduced by a build-config change nobody would connect to CI. Do not
      # set it without replacing the cwd mechanism here.
      #
      # PRs ONLY — on a push the checked-out ref IS main, so base == head.
      #
      # WHY origin/main AND NOT THE MERGE BASE: this job fetches --depth=1 (see
      # the fetch step above), so the histories are disjoint and `git merge-base`
      # finds nothing. Comparing against main's tip is the right question anyway —
      # it is what merging will produce.
      #
      # KNOWN LIMIT, and it is the price of the constant harness: this diffs
      # LIBRARY changes only. A PR that edits `tests/eval/` — the gold set, the
      # scoring — moves both runs together and is invisible here. That needs a
      # human; see compare_retrieval_metrics.py's `_regressions` docstring.
      # `!cancelled()` because a bare `if:` still ANDs the implicit success(), so a
      # HEAD run that trips its own kill-gate would SKIP the comparison — the
      # mirror of the emit-before-gates fix, and the case where "did main already
      # fail this, or did I break it?" is most expensive to answer by hand. The
      # head dump was written either way; this is what lets it be used. An
      # unrelated earlier failure now reaches the step and trips the
      # `test -s "$HEAD_METRICS"` guard, whose "(did it skip?)" wording already
      # covers it. (#833 r3 suggestion.)
      - name: Retrieval diff vs origin/main (#832)
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        working-directory: techne
        env:
          BASE_METRICS: ${{ runner.temp }}/eval-base.json
          HEAD_METRICS: ${{ runner.temp }}/eval-head.json
          BASE_WT: ${{ runner.temp }}/base-worktree
          # A variable only so the script below can be run as-is against another
          # base when demonstrating it locally (#1086). CI always diffs origin/main.
          BASE_REF: origin/main
        run: |
          set -euo pipefail
          # `rm -rf` is cheap insurance on a fresh VM and the real thing if this
          # step is ever run by hand twice; it is safe because `set -u` aborts the
          # step at expansion if BASE_WT is undefined, and the step-level `env:`
          # always defines it.
          rm -f "$BASE_METRICS"
          rm -rf "$BASE_WT"
          test -s "$HEAD_METRICS" || {
            echo "::error::the eval_vec step produced no head metrics (did it skip?)"
            exit 1; }

          git worktree add --detach --force "$BASE_WT" "$BASE_REF"
          # Constant harness: BASE's library, HEAD's tests.
          rm -rf "$BASE_WT/tests"
          cp -R tests "$BASE_WT/tests"

          # `|| echo ::warning` is the ONE intended tolerance: a base that fails its own
          # kill-gates still emits (the gate writes metrics BEFORE asserting), and
          # its numbers are exactly what we want in that case.
          # --continue-on-collection-errors IS LOAD-BEARING (#857). The line above
          # gives the base leg HEAD's tests against MAIN's library, so a PR that
          # adds a module and its test module together makes that test file
          # unimportable here. Collection happens BEFORE marker selection, so the
          # file kills the whole leg even though `-m eval_vec` would have
          # deselected every test in it — no metrics, no diff, red job, on the
          # ordinary shape of a feature PR. The flag collects what it can.
          #
          # It is safe ONLY because compare_retrieval_metrics.py now refuses to
          # diff legs that measured different case counts (#857). Without that
          # guard this flag would convert a loud collection failure into a
          # quiet comparison over unequal case sets, which is techne#832's own
          # defect in a new hat. Do not keep one without the other.
          #
          # TECHNE_EVAL_BASE_LEG (#1086): a PR that adds a search() kwarg and a gold
          # task that sets it would make MAIN's search() raise TypeError at call
          # time, which no collection flag can catch, and the leg would write no
          # metrics. With this set, the harness skips such a task (checked with
          # inspect.signature), lists it under `skipped_no_base`, and the comparer
          # names it "new in HEAD, no base" and diffs the rest. Only this leg sets
          # it; on any other run an unsupported kwarg fails the gate.
          ( cd "$BASE_WT" \
            && TECHNE_EVAL_BASE_LEG=1 \
               TECHNE_EVAL_METRICS_OUT="$BASE_METRICS" \
               "$GITHUB_WORKSPACE/techne/.venv-ci/bin/python" -m pytest -m eval_vec -q \
                  --continue-on-collection-errors ) \
            || echo "::warning::base run did not pass its own kill-gates; diffing anyway"

          git worktree remove --force "$BASE_WT"

          # ONE annotation, not four. The runner parses stdout line by line and
          # every `::error::` line is an independent workflow command, so the
          # multi-line form fragments into sentence pieces in the Checks UI, read
          # out of order and out of context. `%0A` carries real newlines inside a
          # single annotation (#833 r3 nit 2). These are the only annotations in
          # this repo's workflows, so this sets the convention.
          test -s "$BASE_METRICS" || {
            echo "::error::no base metrics produced — cannot diff.%0AMost likely the base leg failed to COLLECT: HEAD's tests/ importing a library symbol that origin/main does not have.%0ACheck the base pytest output above for ImportError/AttributeError."
            exit 1; }
          .venv-ci/bin/python scripts/compare_retrieval_metrics.py \
            "$BASE_METRICS" "$HEAD_METRICS"

      # This is the ONLY job with model2vec: `[vectors]` gates it to py>=3.14
      # (pyproject.toml:45) and the matrix is 3.12/3.13, which get fastembed. So
      # without this step the model2vec branch of EmbeddingModel.embed() runs
      # nowhere — and #536 is a bug in the other branch of that same function
      # (#537). Runs the DEFAULT suite, not a list of vector files: a hand-kept
      # list would drift the first time someone adds a vector-touching test.
      - name: Default suite on the model2vec backend (#537)
        working-directory: techne
        run: .venv-ci/bin/python -m pytest -q -rs -n 4

  # (#383) Architecture-card freshness. Each card in ARCHITECTURE.md / docs/arch/*.md
  # pins the git blob sha of the seam file(s) it describes; this recomputes them and
  # fails when code drifted from its card — turning "detected staleness" into
  # visible-at-PR staleness. The `ci` job below makes a red result block a merge
  # once a ruleset requires it.
  #
  # Same reasoning as the eval gates above: a regression gate that nothing invokes
  # protects nothing (Prudence, #397). This one was written 2026-07-20 and went
  # unwired until 2026-08-02, by which point 2 of 8 cards had silently drifted —
  # including a card carrying a GOTCHA that its own seam had since fixed.
  #
  # Its own unit tests (tests/test_arch_cards_gate.py) run in the matrix job, and as
  # of #706 (test_real_repo_cards_are_fresh) one of those unit tests ALSO runs the
  # gate against the real cards, so this step is no longer the only place that
  # happens — it is CI's copy of the same check, independent of a local pytest run.
  # Stdlib-only and deterministic: no pip install, no extras, ~0.3s.
  arch-cards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout techne
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: techne

      # Setup-python provides the `python3.13` this gate invokes by versioned name,
      # and `git` is on every hosted image; the gate exits 2 with "git executable
      # not found" without it, i.e. loud, not green.
      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'

      - name: Architecture-card freshness gate
        working-directory: techne
        run: python3.13 scripts/check_arch_cards.py

      # (#834) A stray `git worktree add` with an unset path variable collapsed to
      # its two-arg form and committed a mode-160000 gitlink to a PR branch, caught
      # only by reading `git push` output — this repo has no submodules, so ANY
      # 160000 entry is a mistake by definition. Same posture as the gate above:
      # fails this job, and the `ci` job turns that into a red required check.
      - name: Stray gitlink guard
        working-directory: techne
        run: |
          set -uo pipefail
          gitlinks=$(git ls-files -s | grep '^160000' || true)
          if [ -n "$gitlinks" ]; then
            echo "::error::stray gitlink(s) (mode 160000) committed — a worktree was likely added with a missing/misused path argument (techne#834)"
            echo "$gitlinks"
            exit 1
          fi

      # techne#1071: `hooks.commentblockgate` is a REPO-LOCAL git config key, so
      # it only ever reached an operator's own pre-commit hook — and this
      # repo's global hook loader (outside the repo, not this file's concern)
      # never learned a branch for it, so scripts/check_comment_blocks.sh has
      # never run anywhere. This is the mechanism that makes it real. Needs
      # origin/main resolvable, same reason and same fetch as the `test` job.
      - name: Fetch origin/main for the comment-block gate
        working-directory: techne
        run: git fetch --depth=1 origin +refs/heads/main:refs/remotes/origin/main

      # ONE ARG SWITCHES THE SCRIPT FROM ITS PRE-COMMIT SHAPE (diffing the
      # index) TO A CI SHAPE (diffing a base ref against HEAD) — see the
      # script's own header. Diffing against `origin/main` means a comment
      # block already on `main` is never re-flagged here, only one a PR's own
      # commits add.
      - name: Comment-block gate
        working-directory: techne
        run: bash scripts/check_comment_blocks.sh origin/main

  # DCO GATE: its own job, so the check reports under the name `dco` that the
  # branch ruleset requires (tenishai/agora discussion 71). It runs on every
  # event so `ci` can depend on it; the step itself only checks pull requests,
  # and on push or dispatch the job passes with nothing to check.
  dco:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout techne
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: techne

      # DCO (CONTRIBUTING.md): each non-merge commit the PR adds needs a
      # Signed-off-by line matching its author, anywhere in the message (a hook
      # appending a trailer after it moves it out of git's trailer block).
      # Runs before any step that executes the tree, so PR code cannot reach it
      # via GITHUB_PATH/GITHUB_ENV or refs/replace.
      #
      # THIS ONE STEP SERVES FORK PRs TOO, so each exemption has to hold up against
      # a fork that writes its own commits and its own workflow copy.
      #
      # BOT EXEMPTION (PR #1135): a commit authored EXACTLY as
      # `dependabot[bot] <49699333+dependabot[bot]@users.noreply.github.com>`
      # is skipped rather than checked for a Signed-off-by trailer, but ONLY when
      # the PR itself was opened by `dependabot[bot]`. Dependabot DOES sign off, but
      # as `dependabot[bot] <support@github.com>` — that address never matches its
      # noreply author email, and neither one is configurable — so every Dependabot
      # PR failed this check until this exemption. The commit author string alone
      # is not enough: a fork can write a commit with any author, including this
      # one. PR_AUTHOR is the PR opener's login, set by GitHub, which a fork cannot
      # forge.
      #
      # WRITE-ACCESS EXEMPTION (#1182): a PR opened by someone with write
      # access to this repo (admin, maintain or write, from any source: repo,
      # team or org) skips the check, so the rule is enforced on PRs from
      # people outside the team. The step asks GitHub's repository-permission
      # API about the PR author, a login GitHub sets and the PR cannot.
      # author_association is not used: the event payload reported a private
      # org member as COLLABORATOR here (PR #1183's run) and an org admin as
      # CONTRIBUTOR in other tenishai repos, and COLLABORATOR would also cover
      # an outside collaborator with read access. If the lookup fails (a fork PR's
      # read-only token may not be allowed to ask), the full check runs. The lookup
      # is curl and jq; `--globoff` because curl would read the brackets in a bot
      # login such as `dependabot[bot]` as a URL glob. Same lookup as the dco.yml
      # in kobo, ladon, argus, gojira, bab and ergon. Per PR, not per commit: a
      # writer's PR carrying an outsider's commits skips too, which is the same
      # trusted-writer argument as the dependabot exemption.
      #
      # tests/test_ci_workflow_triggers.py::test_dco_check_runs_the_pinned_script
      # pins this script, and the behavioural tests beside it run it.
      - name: DCO sign-off check
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        working-directory: techne
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          perm=$(curl -fsS --globoff --max-time 15 \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/collaborators/$PR_AUTHOR/permission" \
            | jq -r '.permission // empty') || perm=
          case "$perm" in
            admin|maintain|write)
              echo "DCO: skipped, $PR_AUTHOR has $perm access to this repo"
              exit 0
              ;;
            "")
              echo "DCO: the permission lookup for $PR_AUTHOR failed; running the full check"
              ;;
            *)
              echo "DCO: checking, $PR_AUTHOR has $perm access"
              ;;
          esac
          export GIT_NO_REPLACE_OBJECTS=1
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            git fetch --no-tags --quiet --unshallow origin "$BASE_SHA" "$HEAD_SHA"
          else
            git fetch --no-tags --quiet origin "$BASE_SHA" "$HEAD_SHA"
          fi
          commits=$(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA")
          if [ -z "$commits" ]; then
            echo "::error::DCO: no non-merge commits in $BASE_SHA..$HEAD_SHA, so nothing was checked"
            exit 1
          fi
          bad=0
          skipped=0
          for c in $commits; do
            author=$(git log -1 --format='%an <%ae>' "$c")
            if [ "$PR_AUTHOR" = "dependabot[bot]" ] && [ "$author" = "dependabot[bot] <49699333+dependabot[bot]@users.noreply.github.com>" ]; then
              echo "DCO: skipping ${c:0:12} as a bot commit ($author)"
              skipped=$((skipped + 1))
              continue
            fi
            # no `grep -q`: an early exit SIGPIPEs `tr`, and pipefail reads that as a miss
            if ! git log -1 --format=%B "$c" | tr -d '\r' | grep -Fxi -- "Signed-off-by: $author" >/dev/null; then
              echo "::error::DCO: commit ${c:0:12} has no 'Signed-off-by: $author' trailer"
              bad=1
            fi
          done
          if [ "$bad" -ne 0 ]; then
            echo "Sign off with 'git commit -s'. To fix existing commits, see 'Developer Certificate of Origin' in CONTRIBUTING.md."
            exit 1
          fi
          echo "DCO: $(($(echo "$commits" | wc -l | tr -d ' ') - skipped)) commit(s) signed off by their authors$( [ "$skipped" -gt 0 ] && printf ' (%s skipped as bot commits)' "$skipped" )"

  # CRASH-RECOVERY GATE (#388). The `crash` suite SIGKILLs a child mid-write and
  # then proves the store: uncommitted work leaves no trace, committed work
  # survives, a hot WAL replays, an interrupted migration does not stamp its
  # version, and an interrupted flush never marks a row delivered.
  #
  # IT IS EXCLUDED FROM THE DEFAULT RUN, SO THIS JOB IS WHAT MAKES IT REAL.
  # ARCHITECTURE.md draws exactly this line: exclusion alone does not tell you
  # whether a suite is covered by a dedicated job or covered by nothing, and the
  # second decays silently. `-p no:randomly` because these spawn subprocesses and
  # assert on a shared on-disk store; order independence is not a property worth
  # buying here, and a random order that flakes would teach people to re-run CI.
  crash-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout techne
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: techne

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'

      - name: Create venv on Python 3.13
        working-directory: techne
        run: python3.13 -m venv .venv-ci

      - name: Install
        working-directory: techne
        run: |
          .venv-ci/bin/python -m pip install -q --upgrade pip
          .venv-ci/bin/python -m pip install -q -e ".[codex]" pytest

      # -m crash OVERRIDES the addopts exclusion; without this flag the job would
      # report green having selected zero tests, which is the failure mode the
      # comment above exists to prevent.
      - name: Crash-recovery fault injection (#388)
        working-directory: techne
        run: .venv-ci/bin/python -m pytest -m crash -q -rs -p no:randomly

  # (#1059) PROVE THE ARTIFACT, NOT THE CHECKOUT. Every job above installs techne
  # EDITABLE (`uv pip install -e ...`), so pytest always runs with the checkout
  # importable. A packaging defect can't show up there: a module or package-data
  # file missing from the wheel, a wrong `[project.scripts]` target, or a broken
  # `techne.sync_adapters` entry point, because the source tree always satisfies
  # the import regardless of what the wheel actually contains. v0.16.0 already
  # reached external partners with exactly this class of defect (knowledge #2836:
  # a hook template segment missing from the wheel, fixed in 0.16.1).
  #
  # scripts/acceptance.sh does the rest: builds the wheel with `uv build`,
  # installs it into a FRESH venv twice (core, then `[recommended]` — the extra
  # the README's blessed pipx install line uses), `cd`s into a fresh temp dir so
  # the checkout can never shadow the installed package on `sys.path`, and then
  # runs `techne --version` against pyproject's version, every entry point the
  # `techne` distribution declares (tests/test_entry_points.py, which also runs
  # standalone with no pytest), two bundled guides (package data), `init --help`
  # / `doctor --help`, and asserts `techne.__file__` resolves under the venv's
  # site-packages rather than the checkout. Same script docs/releasing.md's SOP
  # calls before tagging — this job does not replace that step (which checks the
  # PUBLISHED tag); it moves the packaging-defect signal from "after tagging" to
  # "on the PR".
  #
  # Hosted `ubuntu-latest` is all it needs: it builds a wheel and installs it. The
  # job installs uv and a 3.12 interpreter (scripts/acceptance.sh defaults to 3.12
  # and calls `uv build` / `uv venv` / `uv pip install` directly), and runs for
  # fork PRs like every other job.
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout techne
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: techne

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Installed-artifact acceptance (core + recommended)
        working-directory: techne
        run: bash scripts/acceptance.sh

  # (#1319) PROVE THE INSTALL, NOT JUST THE WHEEL. `acceptance` builds the wheel
  # with uv; this follows the README as a user does (clone + pip -e, and pipx
  # [recommended]), runs `techne init`, then the hooks, the MCP server, a store
  # and a recall, in a fresh $HOME with uv off PATH. It uses the runner's own
  # python3 (setup-python, 3.12) and installs no uv, so the script's PATH cleaning
  # has nothing to remove. The script is also run by hand in python:3.12-slim.
  # The embedding model downloads cold on every run, on purpose: a user's
  # `techne init` does that, so no model cache is warmed here (unlike #535).
  install-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout techne
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: techne

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: README install paths, end to end (source + pipx)
        working-directory: techne
        run: bash scripts/install-e2e.sh

  # THE JOB A RULESET REQUIRES. `if: always()` makes it run even when a needed job
  # failed, was skipped or was cancelled, and the step then fails unless EVERY
  # needed job's result is exactly `success`. A bare `needs:` would instead SKIP this
  # job when a dependency fails, and a skipped required check can read as passing.
  # Keep this list equal to the jobs above:
  # tests/test_ci_workflow_triggers.py fails if a job is missing from it.
  ci:
    if: ${{ always() }}
    needs: [test, eval-vec, arch-cards, dco, crash-recovery, acceptance, install-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every needed job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' >/dev/null
