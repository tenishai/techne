# TEMPORARY PROBE — delete after it answers its one question.
#
# Since 2026-07-25 every GitHub-hosted job has failed to START on this repo with
# "recent account payments have failed or your spending limit needs to be
# increased". That is the control plane declining to SCHEDULE, not a test failure.
#
# Open question this exists to settle: does that refusal also apply to a
# SELF-HOSTED runner? Sources disagree on whether the announced $0.002/min
# self-hosted platform charge (which covers orchestration/scheduling) ever took
# effect. If it did, self-hosted draws on the same blocked billing and this job
# will not start either. If it didn't, this runs and we have CI back.
#
# Deliberately separate from test.yml so a negative answer changes nothing about
# the real CI config and there is nothing to revert.
name: zz-runner-probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: [self-hosted, linux, x64, dev02]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No actions/setup-python anywhere in here — the image bakes in all three
      # interpreters. If these resolve, the real workflow can drop setup-python
      # too, which is what makes an ephemeral container runner cheap.
      - name: Interpreters are pre-baked
        run: |
          for p in 3.12 3.13 3.14; do printf 'python%s: ' "$p"; python$p -V; done
          printf 'uv: '; uv --version

      - name: Install + run the real suite (3.12)
        run: |
          uv venv --python 3.12 .venv-probe
          uv pip install --python .venv-probe/bin/python -e ".[dev,codex]" --quiet
          .venv-probe/bin/python -m pytest -q

      - name: The eval gates a bare pytest skips
        run: .venv-probe/bin/python -m pytest -m "eval or eval_gate" -q
