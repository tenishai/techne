# Retrieval-correctness regression gate (#385). Extends the #68/#118 recall
# harness with a class-tagged task set that isolates FOUR distinct retrieval
# behaviors instead of one blended recall number:
#
#   exact       — query shares literal tokens with the gold doc
#   paraphrase  — query shares ZERO literal (post-porter-stem) tokens with the
#                 gold doc; a natural-language rephrase. FTS is lexical, not
#                 semantic, so this class is EXPECTED to score low under
#                 use_vectors=False — that gap is itself the signal this class
#                 exists to protect: a future change should not make it worse.
#   filter      — gold doc reachable only when table= narrows correctly; a
#                 same-text distractor lives in a different table and must
#                 never leak in regardless of table scoping.
#   negative    — a lexically-tempting distractor (hard-deleted, or a stale
#                 superseded revision) that must never surface even though it
#                 shares literal tokens with the query.
#
# Gold evidence is referenced by logical key, resolved to type:id via
# seed_eval_db.seed()'s #385 gold block — never hardcoded ids.
#
# Run explicitly (excluded from the default unit suite via addopts):
#   pytest -m eval_gate -s

config:
  k_values: [5, 10]
  # PER-CLASS floors, asserted SEPARATELY (techne#385). A single blended
  # positive-class mean was rejected in review: it lets a real regression in
  # one servable class hide behind another class's headroom (e.g. exact recall
  # dropping 1.0→0.5 still clears a 0.5 blended floor because filter=1.0 and
  # paraphrase=0.0 average back up). Each class the FTS-only path can actually
  # serve gets its own floor at observed − 0.15 (recall_baseline.yaml's
  # tolerance convention).
  #
  # Observed baseline (2026-07-25, FTS-only, use_vectors=False):
  #   exact   : recall@5=1.0  recall@10=1.0  mrr=1.0
  #   filter  : recall@5=1.0  recall@10=1.0  mrr=1.0
  #   negative: fpr=0.0
  #   paraphrase (informational, NOT gated): recall@5=0.0 recall@10=0.0 mrr=0.0
  #
  # paraphrase is EXCLUDED from pass/fail: its tasks carry `deterministic:
  # false`. Paraphrase queries share zero literal (post-porter-stem) tokens
  # with their gold doc by construction, and FTS is lexical not semantic, so
  # the FTS-only path structurally cannot serve them — gating the deterministic
  # path on a capability it does not have would be dishonest. The 6 paraphrase
  # tasks stay in this file (the gold set stays complete) as pre-authored
  # targets for the future backend-pinned VECTOR arm; the runner reports their
  # scores as informational only.
  exact:
    recall_at_5_floor: 0.85
    recall_at_10_floor: 0.85
    mrr_floor: 0.85
  filter:
    recall_at_5_floor: 0.85
    recall_at_10_floor: 0.85
    mrr_floor: 0.85
  # Negatives target 0.0 (nothing forbidden should ever surface); the observed
  # baseline hit exactly 0.0 (deletion + supersession filtering both held even
  # against lexically-tempting queries) — ceiling has NO slack; any leak is a
  # regression.
  negative:
    fpr_ceiling: 0.0

# VECTOR-arm config (techne#399). Reuses the SAME 24 tasks below via
# search(..., use_vectors=True) with the model2vec/potion-base-8M singleton
# pinned (see tests/eval/conftest.py's pinned_model2vec fixture) — RRF-fused
# BM25 + vector recall, not FTS-only. `paraphrase` gets a real floor here
# (unlike `config:` above) because RRF fusion is exactly the mechanism meant
# to serve zero-token-overlap queries that the FTS-only path structurally
# cannot.
#
# Observed baseline (2026-07-25, use_vectors=True, model2vec/potion-base-8M
# pinned, half_life_days=30.0 — measured via test_retrieval_gate_vec.py):
#   exact     : recall@5=1.0   recall@10=1.0   mrr=1.0    (unchanged vs FTS-only)
#   filter    : recall@5=1.0   recall@10=1.0   mrr=1.0    (unchanged vs FTS-only)
#   negative  : fpr=0.0                                   (unchanged vs FTS-only)
#   paraphrase: recall@5=0.5   recall@10=0.667 mrr=0.144  (was 0/0/0 FTS-only)
# No class regressed with vectors on — exact/filter/negative held their FTS
# baseline exactly (RRF keeps an already-rank-1 FTS hit at rank 1), so this is
# a strict improvement, not a tradeoff.
config_vec:
  k_values: [5, 10]
  exact:
    recall_at_5_floor: 0.85
    recall_at_10_floor: 0.85
    mrr_floor: 0.85
  filter:
    recall_at_5_floor: 0.85
    recall_at_10_floor: 0.85
    mrr_floor: 0.85
  # paraphrase is GATED here (a 6-task class whose golds sit in the drift-fragile
  # rank 4–10 band, where near-tie BLAS reordering across machines can push one
  # in/out of top-k — e.g. paraphrase-tlsrotation). Floors keep Prudence's PR#400
  # rule: tolerate a ±1-task boundary shift, yet trip a REAL regression.
  # RATCHETED for techne#401 (vec-first union replaced RRF). Post-fix observed on
  # this class: r@5=0.667, r@10=1.0, MRR=0.546 (was RRF r@5=0.5, r@10=0.667,
  # MRR=0.144). The floors now LOCK IN that win while staying boundary-tolerant:
  #   - recall_at_10 0.8: trips the RRF regression (0.667 < 0.8) and the
  #     no-backfill catastrophe (0.0), yet a single gold slipping rank 10→11
  #     (r@10 1.0→0.833) still passes.
  #   - mrr_floor 0.4 (NEW): MRR is the axis where vec-first wins most (0.546 vs
  #     RRF 0.144) AND the most boundary-robust — it keys off the FIRST hit's
  #     rank, not top-k membership at the fragile boundary. A 1-task rank-1→2
  #     slip (mean → ~0.463) still passes; a relapse toward RRF (0.144) trips
  #     hard. This floor is only non-vacuous BECAUSE the fix moved observed MRR
  #     from 0.144 to 0.546 (the pre-fix -0.15 tolerance went negative → dead).
  paraphrase:
    recall_at_5_floor: 0.5
    recall_at_10_floor: 0.8
    mrr_floor: 0.4
  negative:
    fpr_ceiling: 0.0

tasks:
  # --- exact: literal token overlap with the gold doc ---------------------
  - id: exact-ratelimiter
    class: exact
    query: "token bucket rate limiter client key refill"
    table: knowledge
    expected_keys: [g385_ratelimiter]
    forbidden_keys: []

  - id: exact-cacheinvalidation
    class: exact
    query: "cache invalidation write-through strategy stale reads"
    table: knowledge
    expected_keys: [g385_cacheinvalidation]
    forbidden_keys: []

  - id: exact-circuitbreaker
    class: exact
    query: "circuit breaker trips open consecutive downstream failures"
    table: knowledge
    expected_keys: [g385_circuitbreaker]
    forbidden_keys: []

  - id: exact-retrybackoff
    class: exact
    query: "retry backoff exponential delay jitter doubling wait time"
    table: knowledge
    expected_keys: [g385_retrybackoff]
    forbidden_keys: []

  - id: exact-tlsrotation
    class: exact
    query: "TLS certificate rotation web server active connections"
    table: knowledge
    expected_keys: [g385_tlsrotation]
    forbidden_keys: []

  - id: exact-dbpool
    class: exact
    query: "database connection pooling connections per service recycle"
    table: knowledge
    expected_keys: [g385_dbpool]
    forbidden_keys: []

  # --- paraphrase: zero literal-token overlap (verified via the porter
  #     unicode61 tokenizer in a throwaway fts5 table, not eyeballed) --------
  - id: paraphrase-ratelimiter
    class: paraphrase
    deterministic: false  # FTS-only can't serve zero-token-overlap; VECTOR-arm target
    query: "How many calls can single caller make before we start rejecting extra load on our external interface"
    table: knowledge
    expected_keys: [g385_ratelimiter]
    forbidden_keys: []

  - id: paraphrase-cacheinvalidation
    class: paraphrase
    deterministic: false  # FTS-only can't serve zero-token-overlap; VECTOR-arm target
    query: "When data changes how do we make sure stored copy never shows old information"
    table: knowledge
    expected_keys: [g385_cacheinvalidation]
    forbidden_keys: []

  - id: paraphrase-circuitbreaker
    class: paraphrase
    deterministic: false  # FTS-only can't serve zero-token-overlap; VECTOR-arm target
    query: "Once several backend calls fail back to back the connector pauses briefly then tries again with one test call"
    table: knowledge
    expected_keys: [g385_circuitbreaker]
    forbidden_keys: []

  - id: paraphrase-retrybackoff
    class: paraphrase
    deterministic: false  # FTS-only can't serve zero-token-overlap; VECTOR-arm target
    query: "When something goes wrong caller pauses progressively longer adding randomness before trying once more topping out near one minute"
    table: knowledge
    expected_keys: [g385_retrybackoff]
    forbidden_keys: []

  - id: paraphrase-tlsrotation
    class: paraphrase
    deterministic: false  # FTS-only can't serve zero-token-overlap; VECTOR-arm target
    query: "How often do we swap out security credentials for our site does that disrupt anyone currently logged in"
    table: knowledge
    expected_keys: [g385_tlsrotation]
    forbidden_keys: []

  - id: paraphrase-dbpool
    class: paraphrase
    deterministic: false  # FTS-only can't serve zero-token-overlap; VECTOR-arm target
    query: "What is maximum number of simultaneous links single caller may hold open to storage before unused ones get closed automatically"
    table: knowledge
    expected_keys: [g385_dbpool]
    forbidden_keys: []

  # --- filter: gold reachable only when table narrows; same-text distractor
  #     lives in a different table ------------------------------------------
  - id: filter-batch-compaction
    class: filter
    query: "nightly batch compaction job reclaim deleted row space archive table"
    table: knowledge
    expected_keys: [g385_filter_batch]
    forbidden_keys: [g385_filter_batch_distractor]

  - id: filter-log-retention
    class: filter
    query: "log retention policy fourteen days hot storage cold archive"
    table: knowledge
    expected_keys: [g385_filter_logretention]
    forbidden_keys: [g385_filter_logretention_distractor]

  - id: filter-sliding-window
    class: filter
    query: "sliding window counter burst control ratelimit module"
    table: observations
    expected_keys: [g385_filter_slidingwindow]
    forbidden_keys: [g385_filter_slidingwindow_distractor]

  - id: filter-test-suite
    class: filter
    query: "sliding window counter test suite twelve passed verified"
    table: observations
    expected_keys: [g385_filter_testsuite]
    forbidden_keys: [g385_filter_testsuite_distractor]

  - id: filter-flag-rollout
    class: filter
    query: "feature flag rollout percentage gating ramp error rate"
    table: threads
    expected_keys: [g385_filter_flagrollout]
    forbidden_keys: [g385_filter_flagrollout_distractor]

  - id: filter-queue-depth
    class: filter
    query: "queue depth backpressure alert threshold five hundred messages"
    table: threads
    expected_keys: [g385_filter_queuedepth]
    forbidden_keys: [g385_filter_queuedepth_distractor]

  # --- negative: lexically-tempting distractor must stay OUT of top-k ------
  - id: negative-deleted-backup
    class: negative
    query: "backup schedule policy nightly full backup pg_dump S3 cold bucket"
    table: all
    expected_keys: []
    forbidden_keys: [g385_neg_del_backup]

  - id: negative-deleted-authmigration
    class: negative
    query: "auth provider migration Okta WorkOS SSO login"
    table: all
    expected_keys: []
    forbidden_keys: [g385_neg_del_authmigration]

  - id: negative-deleted-stagingregion
    class: negative
    query: "staging environment region AWS us-west-1 us-east-2 latency"
    table: all
    expected_keys: []
    forbidden_keys: [g385_neg_del_stagingregion]

  - id: negative-stale-oncall
    class: negative
    query: "on-call rotation cadence weekly Monday"
    table: all
    expected_keys: [g385_neg_sup_oncall_new]
    forbidden_keys: [g385_neg_sup_oncall_old]

  - id: negative-stale-redis
