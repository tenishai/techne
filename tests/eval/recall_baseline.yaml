# Frozen recall-eval tasks (#68). Each task's gold evidence is referenced by a
# logical key (resolved to a type:id by seed_eval_db.py) plus a phrase rubric.
# M1: 3 starter tasks. M2 expands to 5-10 and freezes the Phase-0 baseline.
#
# All three queries are natural-language / multi-word and deliberately contain
# a term absent from the gold (no stemming in FTS), so they exercise the #70
# OR-fallback path that real recall topics hit.
#
# NOTE: queries avoid literal FTS5 operator chars (e.g. "#") for now — those
# crash search() pre-#74. Once #74 hardens _sanitize_fts_query, add a task with
# "cabal#14" verbatim to lock in the fix.

config:
  top_k: 10
  # Per-category kill-gates (techne#118). floor = that category's frozen aggregate
  # minus 0.15 tolerance; margin = techne must beat the no-memory control by this.
  # Legacy `exact-recall` keeps the #68 M2 values byte-for-byte. See EVAL.md/PHASE0.md.
  gates:
    exact-recall: {floor: 0.85, margin: 0.3}
    tracking:     {floor: 0.85, margin: 0.3}
    aggregation:  {floor: 0.85, margin: 0.3}
    # Stage-2 (LLM-judged) negative-polarity categories — techne#118 PR3+.
    # Conservative floors (0.5): these are model-judged so variance is higher
    # than the deterministic Stage-1 rubric. margin=0.0 (no bare-arm baseline
    # to compare against; the assertion is about answer quality, not retrieval).
    absence:      {floor: 0.5, margin: 0.0}
    deletion:     {floor: 0.5, margin: 0.0}
    cascade:      {floor: 0.5, margin: 0.0}
  # The raw-source-dump arm must lose decisively to curated on the cost axis (the
  # techne thesis): curated precision >= this multiple of raw-dump precision.
  cost_precision_ratio: 3.0

tasks:
  - id: cabal14-design
    category: exact-recall
    query: "cabal 14 archivist outbox decision and rationale"
    table: all
    gold_keys: [cabal14]
    must_include_phrases: ["mailbox-as-tag-slice"]
    must_exclude_phrases: []
    weight: 1.0

  - id: adapter-recency
    category: exact-recall
    query: "techne sync adapter py SourceAdapter relocation"
    table: observations
    gold_keys: [adapter_touch]
    must_include_phrases: ["adapter.py"]
    must_exclude_phrases: []
    weight: 1.0

  - id: reflect-candidates
    category: exact-recall
    query: "how does the reflect experiment promote candidates"
    table: all
    gold_keys: [reflect_candidates]
    must_include_phrases: ["knowledge_candidates"]
    must_exclude_phrases: []
    weight: 1.0

  - id: reflect-thread
    category: exact-recall
    query: "threads about the reflect experiment observation window"
    table: threads
    gold_keys: [reflect_thread]
    must_include_phrases: ["reflect-pass"]
    must_exclude_phrases: []
    weight: 1.0

  - id: canonical-remote
    category: exact-recall
    query: "which git remote is canonical for techne github or gitea"
    table: all
    gold_keys: [canonical_remote]
    must_include_phrases: ["canonical"]
    must_exclude_phrases: []
    weight: 1.0

  - id: platform-state-delta
    category: exact-recall
    query: "platform state changes delta since 2026-06-15"
    table: all
    gold_keys: [platform_state]
    must_include_phrases: ["rookery-mcp"]
    must_exclude_phrases: []
    weight: 1.0

  # --- tracking (techne#118): supersession freshness — return the LATEST revision,
  #     never the stale ones. The #90 acceptance test. must_exclude is checked over
  #     the whole result list (scoring.py), so a stale leak at any rank fails.
  - id: deploy-target-current
    category: tracking
    query: "what is the current eval-stack deploy target host"
    table: all
    gold_keys: [deploy_target]
    must_include_phrases: ["dev03-current"]
    must_exclude_phrases: ["dev01-old", "dev02-mid"]
    weight: 1.0

  # --- aggregation (techne#118): one topic, N pieces — ALL must be recalled.
  - id: eval-runbook-steps
    category: aggregation
    query: "eval rollout runbook steps freeze gate archive"
    table: all
    gold_keys: [agg_step1, agg_step2, agg_step3]
    must_include_phrases: ["runbook"]
    must_exclude_phrases: []
    weight: 1.0

  # --- Stage 2 (techne#118 PR3+): authored for taxonomy completeness, SKIPPED by
  #     the runner (`stage: 2`). Their real failure — the model ASSERTS an absent /
  #     deleted / should-be-uncertain fact — deterministic search() cannot exhibit;
  #     they need the LLM answerer + defensive judge. cascade also waits on #117.
  - id: absent-feature
    category: absence
    stage: 2
    query: "does techne auto-bisect regressions across git history"
    table: all
    gold_keys: []
    must_include_phrases: []
    must_exclude_phrases: []
    weight: 1.0

  - id: deleted-fact
    category: deletion
    stage: 2
    query: "the deleted eval scratch note about the abandoned vector index"
    table: all
    gold_keys: []
    must_include_phrases: []
    must_exclude_phrases: []
    weight: 1.0

  - id: cascade-uncertain
    category: cascade
    stage: 2
    query: "is the derived eval deploy path still trustworthy after its source changed"
    table: all
    gold_keys: []
    must_include_phrases: []
    must_exclude_phrases: []
    weight: 1.0
