# Frozen recall-eval tasks (#68). Each task's gold evidence is referenced by a
# logical key (resolved to a type:id by seed_eval_db.py) plus a phrase rubric.
# M1: 3 starter tasks. M2 expands to 5-10 and freezes the Phase-0 baseline.
#
# All three queries are natural-language / multi-word and deliberately contain
# a term absent from the gold (no stemming in FTS), so they exercise the #70
# OR-fallback path that real recall topics hit.
#
# NOTE: queries avoid literal FTS5 operator chars (e.g. "#") for now — those
# crash search() pre-#74. Once #74 hardens _sanitize_fts_query, add a task with
# "cabal#14" verbatim to lock in the fix.

config:
  top_k: 10
  # Kill-gate (#68 M2). See EVAL.md for rationale. gate = frozen Phase-0
  # aggregate (1.0) minus 0.15 tolerance; margin = techne must beat bare by this.
  gate: 0.85
  margin: 0.3

tasks:
  - id: cabal14-design
    category: decision-recall
    query: "cabal 14 archivist outbox decision and rationale"
    table: all
    gold_keys: [cabal14]
    must_include_phrases: ["mailbox-as-tag-slice"]
    must_exclude_phrases: []
    weight: 1.0

  - id: adapter-recency
    category: activity-recall
    query: "techne sync adapter py SourceAdapter relocation"
    table: observations
    gold_keys: [adapter_touch]
    must_include_phrases: ["adapter.py"]
    must_exclude_phrases: []
    weight: 1.0

  - id: reflect-candidates
    category: multiword-recall
    query: "how does the reflect experiment promote candidates"
    table: all
    gold_keys: [reflect_candidates]
    must_include_phrases: ["knowledge_candidates"]
    must_exclude_phrases: []
    weight: 1.0

  - id: reflect-thread
    category: thread-recall
    query: "threads about the reflect experiment observation window"
    table: threads
    gold_keys: [reflect_thread]
    must_include_phrases: ["reflect-pass"]
    must_exclude_phrases: []
    weight: 1.0

  - id: canonical-remote
    category: decision-recall
    query: "which git remote is canonical for techne github or gitea"
    table: all
    gold_keys: [canonical_remote]
    must_include_phrases: ["canonical"]
    must_exclude_phrases: []
    weight: 1.0

  - id: platform-state-delta
    category: fact-recall
    query: "platform state changes delta since 2026-06-15"
    table: all
    gold_keys: [platform_state]
    must_include_phrases: ["rookery-mcp"]
    must_exclude_phrases: []
    weight: 1.0
